<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash test">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dashboard Noam (test)</title>
<style>
/* Style : accueil-bento.html. iPad Air 1 / Safari 12 : pas de flou calculé, pas de filter,
   pas d'animation en boucle, transitions sur transform/opacity uniquement, pas de flex gap. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;width:100%;overflow:hidden}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:#fff;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);border-radius:9999px;min-height:70px;min-width:70px;font-size:26px;font-weight:600;padding:0 26px;-webkit-appearance:none;cursor:pointer;line-height:1.15}
button{transition:opacity .12s}
button:active{opacity:.55;transition:none}
button.white{background:#fff;color:#111;border-color:#fff}
button.vio{color:#cbb8ff}
[data-act]{cursor:pointer}
input,textarea{font-family:inherit;font-size:28px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.24);border-radius:16px;height:70px;padding:0 16px;-webkit-appearance:none;outline:none}
input:focus,textarea:focus{border-color:#fff}
select{font-family:inherit;font-size:24px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.24);border-radius:16px;height:70px;padding:0 16px;-webkit-appearance:none;outline:none}
input::-webkit-input-placeholder{color:rgba(255,255,255,.35)}
textarea{height:auto;font-size:15px;font-weight:400;padding:12px;width:100%;font-family:Menlo,monospace}
.hidden{display:none !important}
.row{display:flex;align-items:center}
.row > * + *{margin-left:14px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
.muted{color:rgba(255,255,255,.6)}
.inl{display:inline-block;width:22px;height:22px;vertical-align:-3px;margin-left:6px}

/* Verre dépoli SANS calcul : fond flouté (blur.jpg) calé une fois par alignGlass() */
.glass{position:relative;border-radius:28px;border:1px solid rgba(255,255,255,.16);background:#1c1c1e;overflow:hidden}
/* Safari 12 : un enfant animé (will-change / transform) sort des coins arrondis malgré overflow:hidden → on arrondit aussi l'intérieur */
.t-in,.fc-in{border-radius:inherit}
.glass.light{color:#111;border-color:#E9E9EC;background:#E9E9EC}
.card{padding:24px}
.tap{transition:opacity .12s}
.tap:active{opacity:.7;transition:none}
.label{font-size:17px;font-weight:600;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.light .label{color:rgba(0,0,0,.55)}
.small{font-size:19px;color:rgba(255,255,255,.7);margin-top:6px}
.light .small{color:rgba(0,0,0,.6)}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:8px;vertical-align:1px}
.g{background:#4ade80}.v{background:#A78BFA}

/* Écrans */
.screen{position:absolute;top:20px;left:0;right:0;bottom:0;display:none;flex-direction:column;padding:12px 28px 18px}
.screen.active{display:flex}
.hdr{height:76px;flex-shrink:0;margin-bottom:16px}
.h1{font-size:36px;font-weight:600;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:19px;color:rgba(255,255,255,.7);margin-top:3px;white-space:nowrap}
.rbtn{width:70px;height:70px;padding:0;border-radius:35px}
.fbtnF{font-size:32px;font-weight:800}
.rbtn svg{display:block;width:30px;height:30px;margin:auto}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;z-index:0}
/* Safari 12 : dans une longue liste qui défile, chaque carte garde ses calques chez elle (sinon elles se dessinent hors de la zone) */
.content > .glass{z-index:0}
.foot{height:86px;margin-top:16px;flex-shrink:0}
.foot button{flex:1;height:86px;font-size:30px}
.empty{font-size:26px;color:rgba(255,255,255,.6);text-align:center;padding:30px 0}

/* Accueil : disposition de accueil-bento_1.html
   gauche = Suivi des factures (grande carte) ; droite haut = Devis + Projets ; droite bas = Musique */
.hclock{font-size:58px;font-weight:300;letter-spacing:-1px}
.widgets{flex:1;min-height:0;display:flex}
/* Accueil sur 2 pages : glisser à gauche / à droite */
.hpager{flex:1;min-height:0;overflow:hidden}
.htrack{display:flex;width:200%;height:100%;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0);transition:transform .75s cubic-bezier(.32,.72,0,1)}
.htrack.p1{-webkit-transform:translate3d(-50%,0,0);transform:translate3d(-50%,0,0)}
.hpage{width:50%;height:100%;display:flex;flex-shrink:0;overflow:hidden;padding-right:2px}
.hdots{flex-shrink:0;height:26px;padding-top:14px;text-align:center;white-space:nowrap;font-size:0}
.hdots span{display:inline-block;width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.3);margin:0 6px}
.hdots span.on{background:#fff}
.widgets2{align-items:stretch}
.p2{flex:1;min-width:0;display:flex;flex-direction:column}
.p2-top{flex:1.35;min-height:0;display:flex}
.p2-pipe{flex:2}
.p2-mat{flex:1;margin-left:18px}
.p2-bot{flex:1;min-height:0;margin-top:18px;display:flex}
.pstages{position:absolute;left:24px;right:24px;bottom:84px;display:flex}
.pst{flex:1;min-width:0;text-align:left}
.pst b{display:block;font-size:52px;font-weight:700;line-height:1}
.pst span{display:block;font-size:15px;color:rgba(255,255,255,.6);margin-top:6px;white-space:nowrap}
.pst.fact b,.pst.fact span{color:#cbb8ff}
.lchips{position:absolute;right:24px;bottom:22px;display:flex}
.lchip{background:rgba(255,255,255,.08);border-radius:18px;padding:12px 18px;margin-left:12px;max-width:220px}
.lchip span{display:block;font-size:17px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lchip b{display:block;font-size:24px;font-weight:700;margin-top:2px;white-space:nowrap}
.widgets2 .wsmall{flex:0 0 auto;width:300px;height:280px}
.bl{flex:1;min-width:0;display:flex}
.br{flex:1;min-width:0;margin-left:18px;display:flex;flex-direction:column}
.br-top{flex:1;min-height:0;display:flex}
.br-bot{flex:1;min-height:0;margin-top:18px;display:flex}
.widget{flex:1;min-width:0;padding:24px}
.br-top .widget + .widget{margin-left:18px}
.widget{transition:opacity .12s}
.widget:active{opacity:.7;transition:none}
.wtile{width:100px;height:100px;border-radius:30%;background:#fff;color:#111;padding:24px}
.wtile svg{display:block;width:52px;height:52px}
.light .wtile{background:#111;color:#fff}
.wtile.wait{opacity:.5}
.wtile.ok{background:#4ade80}
.wname{position:absolute;left:24px;bottom:22px;font-size:38px;font-weight:600;white-space:nowrap}
.chev{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.18)}
.chev svg{display:block;width:22px;height:22px;margin:13px auto}
.light .chev{background:#111;color:#A78BFA}

/* Interrupteurs iOS */
.tgl{position:relative;display:inline-block;width:64px;height:38px;border-radius:19px;background:rgba(255,255,255,.22)}
.tgl .knob{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:16px;background:#fff;transition:transform .2s}
.tgl.on{background:#4ade80}
.tgl.on .knob{transform:translateX(26px)}
.tgl.big{width:96px;height:56px;border-radius:28px}
.tgl.big .knob{top:4px;left:4px;width:48px;height:48px;border-radius:24px}
.tgl.big.on .knob{transform:translateX(40px)}
.tgl-hit{position:absolute;top:6px;right:6px;width:90px;height:70px;text-align:center;padding-top:16px}
.tgl-hit.big{position:static;width:120px;height:80px;padding-top:12px}

/* Suivi des factures (data/factures.json, rempli par la routine du planning) */
.fac{display:flex;flex-direction:column}
.fw-big{font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1;white-space:nowrap}
.fw-sub{font-size:24px;color:rgba(255,255,255,.7);margin-top:8px;white-space:nowrap}
.fw-sub b{color:#cbb8ff}
.fw-name{font-size:38px;font-weight:600;margin-top:18px;white-space:nowrap}
.ftots{margin:0 0 8px}
.fprev{margin:0 0 12px;padding:12px 22px;border-radius:18px;background:#141416;font-size:21px;color:rgba(255,255,255,.5);align-items:baseline}
.fprev .fp-v{font-size:26px;font-weight:700;color:rgba(255,255,255,.8)}
.fprev .fp-n{margin-left:22px;font-size:22px;color:rgba(255,255,255,.5)}
.fcard{display:block;padding:0;margin-bottom:14px;border-left:8px solid #1c1c1e}
.fc-in{position:relative;z-index:1;padding:18px 22px;background:#1c1c1e;transition:transform .45s cubic-bezier(.2,1.15,.36,1)}
.fcard.open .fc-in{-webkit-transform:translate3d(-230px,0,0);transform:translate3d(-230px,0,0)}
/* glisser une facture à gauche : Annuler / Délai */
.fi-b{margin-bottom:18px}
.fi-big{font-size:34px;font-weight:700;margin-top:2px}
.fi-s{font-size:20px;margin-top:2px}
.fi-l{font-size:24px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.fi-v{font-weight:600;text-align:right}
.frg{align-items:center;margin-bottom:16px}
/* fenêtre Réglages d'une facture : lignes compactes, libellé à gauche, réglage à droite */
.rgl-h{display:flex;align-items:baseline;margin:0 0 10px}
.rgl-h b{flex:1;font-size:32px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgl-h span{font-size:26px;color:rgba(255,255,255,.55);margin-left:16px}
.rgl{display:flex;align-items:center;min-height:90px;border-bottom:1px solid rgba(255,255,255,.08)}
.rgl-l{flex:1;font-size:26px;font-weight:600}
.rgl-l span{display:block;font-size:19px;font-weight:400;color:rgba(255,255,255,.5);margin-top:3px}
.rgl .stp-l{display:none}
.rgl .sb{width:58px;height:58px;min-width:58px;min-height:58px;font-size:32px;border-radius:29px}
.rgl .sv{min-width:64px;font-size:28px;margin:0 6px}
.rgd{width:210px;font-size:22px;height:70px}
.rgl.small{min-height:80px;border-bottom:0}
.rgl.small .rgl-l{font-size:22px;color:rgba(255,255,255,.75)}
.rgl.small .rgd{width:215px}
.rgl-add{background:none;border:0;padding:0;font-size:21px;font-weight:600;color:rgba(255,255,255,.5)}
.rgl-x{width:70px;padding:0;margin-left:8px;background:none;border:0;color:rgba(255,255,255,.5);font-size:24px}
.rgl-next{font-size:22px;color:rgba(255,255,255,.6);margin:14px 0 18px}
.rgl-next b{color:#fff;margin-left:8px}
.frg-v{font-size:24px;font-weight:600;margin-top:4px}
.fc-act{position:absolute;z-index:0;top:0;right:0;bottom:0;width:230px;display:flex;align-items:center;justify-content:center;background:#2a2a2e}
.fc-act button{height:76px;font-size:21px;padding:0 16px;white-space:nowrap}
.fc-act button + button{margin-left:12px}
/* Listes : colonnes comme Matériel, lignes compactes, glisser à gauche = Modifier / Supprimer */
.widgets2 .wsmall + .wsmall{margin-left:18px}
.wsub{position:absolute;left:24px;bottom:72px;font-size:22px;color:rgba(255,255,255,.6);white-space:nowrap}
.wsub b{color:#fff}
.pcols{display:flex;overflow:hidden}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column}
.pcol + .pcol{margin-left:14px}
.pcol-h{flex-shrink:0;padding:4px 6px 10px}
.pcol-t{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol-s{font-size:18px;color:rgba(255,255,255,.55);margin-top:2px;white-space:nowrap}
.pcol-l{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.pcol.fact .pcol-t,.pcol.fact .pcol-s b{color:#cbb8ff}
.ppc{background:#1c1c1e;border-radius:18px;padding:12px 14px;margin-bottom:10px}
.pcol.fact .ppc{background:#241f33}
.ppc-c{font-size:15px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-n{font-size:21px;font-weight:700;margin-top:2px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-b{display:flex;align-items:baseline;margin-top:8px}
.pc-v{font-size:22px;font-weight:700}
.pc-p{margin-left:auto;font-size:17px;color:rgba(255,255,255,.5);white-space:nowrap}
.ptags{margin-top:6px}
.ptag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.5px;border:1.5px solid;border-radius:8px;padding:2px 7px;margin:0 6px 4px 0}
.ppempty{font-size:18px;color:rgba(255,255,255,.35);padding:8px 6px}
.ppause{flex-shrink:0;font-size:18px;color:rgba(255,255,255,.45);padding:10px 6px 0}
.pi-r{display:flex;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:22px}
.pi-r span{color:rgba(255,255,255,.55);width:170px;flex-shrink:0}
.ltab-add{color:rgba(255,255,255,.6);text-align:center}
.lsum{display:flex;align-items:baseline;padding:10px 6px 14px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.lsum b{flex:1;font-size:44px;font-weight:800}
.lsum b small{font-size:22px;font-weight:500;opacity:.6}
.lsum span{font-size:22px;color:rgba(255,255,255,.6)}
.lcard{position:relative;margin-bottom:10px;border:0;border-radius:20px;overflow:hidden;background:#1c1c1e}
.lcard .fc-in.lin{display:flex;align-items:center;height:76px;padding:0 20px;background:#2a2a2e}
.lcard .ln{flex:1;min-width:0;font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .lp{flex-shrink:0;margin-left:14px;font-size:27px;font-weight:700}
.lcard .lp small{font-size:18px;font-weight:500;opacity:.6}
.lcard .fc-act{width:300px;background:#1c1c1e}
.lcard.open .fc-in{-webkit-transform:translate3d(-300px,0,0);transform:translate3d(-300px,0,0)}
.lcard .fc-act button{height:62px;font-size:21px;padding:0 18px}
.lcard.paid .ln{opacity:.45;text-decoration:line-through}
.lbox{flex-shrink:0;width:50px;height:50px;min-width:0;min-height:0;padding:0;margin-right:16px;border-radius:14px;font-size:26px;font-weight:800;background:transparent;border:2px solid rgba(255,255,255,.3)}
.lbox.on{background:#4ade80;border-color:#4ade80;color:#111}
.tot-v{overflow:hidden;text-overflow:ellipsis}
/* Matériel */
.mcard{min-height:170px}
.mc-n{font-size:40px;font-weight:700;margin:8px 0}
.mc-l{font-size:19px;color:rgba(255,255,255,.6);line-height:1.3}
.mcard.done{border-color:#4ade80}
.mcard.done .mc-n{color:#4ade80}
.mchk{flex:1;min-width:0;display:block;text-align:left;height:84px;font-size:28px;padding:0 20px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchk .tchk{display:inline-block;vertical-align:middle;width:52px;height:52px;line-height:46px;margin:0 18px 0 0;border-radius:14px;font-size:28px}
.mchk.on{background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.5)}
.mchk.on .tchk{background:#4ade80;border-color:#4ade80}
.mrow2{margin-bottom:12px}
.tgrow{margin:0 0 14px}
.tglab{font-size:22px;color:rgba(255,255,255,.6);margin-bottom:10px}
.tgb{height:70px;min-height:70px;font-size:19px;font-weight:800;letter-spacing:.5px;padding:0 20px;margin:0 10px 10px 0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.tgb.on{background:#A78BFA;border-color:#A78BFA;color:#111}
.tgb.on.u1{background:#facc15;border-color:#facc15}
.tgb.on.u2{background:#fb923c;border-color:#fb923c}
.tgb.on.u3{background:#f87171;border-color:#f87171}
.tgb.brand{background:rgba(255,255,255,.18);color:#fff;text-transform:uppercase}
/* fiche : modifs = glisser à gauche (Modifier / Supprimer), appui long = déplacer */
#modal .scard{-webkit-mask-image:-webkit-radial-gradient(white,black);position:relative;z-index:0;margin-bottom:12px;border:0;border-radius:20px;overflow:hidden;background:#000}
#modal .scard .fc-in{padding:0;background:#000;border-radius:20px}
#modal .scard .mchk{width:100%;background:#1c1c1e}
#modal .scard .mchk.on{background:#183824}
#modal .scard .fc-act{width:300px;background:#000}
#modal .scard.open .fc-in{-webkit-transform:translate3d(-300px,0,0);transform:translate3d(-300px,0,0)}
#modal .scard .fc-act button{height:70px;font-size:22px;padding:0 20px}
#modal .scard.drag{z-index:5;opacity:.85}
#modal .scard.drag .fc-in{transition:none}
#modal .scard.mv{transition:transform .18s}
.mat{display:flex;overflow:hidden}
.mat-l{width:380px;flex-shrink:0;margin-right:18px;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mat-r{flex:1;min-width:0;padding:6px 18px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msel{display:block;width:100%;text-align:left;height:84px;font-size:27px;padding:0 18px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;background:transparent;border-color:rgba(255,255,255,.12)}
.msel .tchk{display:inline-block;vertical-align:middle;width:46px;height:46px;line-height:40px;margin:0 16px 0 0;border-radius:13px;font-size:26px}
.msel.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.msel.on .tchk{background:#fff;border-color:#fff;color:#111}
.msel .ed{float:right;font-size:22px;color:rgba(255,255,255,.55)}
.mgh{font-size:18px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px}
.mgh b{float:right}
.mgh.ok,.mgh.ok b{color:#4ade80}
.mat-r .mchk{width:100%;margin-bottom:10px}
.mline{display:flex;align-items:center}
.mline .mchk{flex:1;width:auto}
.mline .mstep{margin:0 0 10px 12px}
.mstep{flex-shrink:0;display:flex;align-items:center}
.mstep button{width:58px;height:58px;padding:0;border-radius:29px;font-size:28px;font-weight:700}
.mstep span{min-width:64px;text-align:center;font-size:26px;font-weight:700}
.mstep small{font-size:18px;opacity:.55}
.mq{color:rgba(255,255,255,.55);font-weight:700;margin-left:6px}
.mseg{display:flex;margin-right:12px;border-radius:35px;background:rgba(255,255,255,.08);padding:4px}
.mseg button{height:62px;padding:0 22px;border-radius:31px;border:0;background:transparent;font-size:22px;font-weight:700;color:rgba(255,255,255,.6)}
.mseg button.on{background:#fff;color:#111}
.mready{padding:16px;text-align:center;font-size:28px;font-weight:700;color:#4ade80}
.mhint{font-size:24px;color:rgba(255,255,255,.55);text-align:center;padding:40px 10px;line-height:1.4}
.fc-top,.fc-bot{display:flex;align-items:center}
.fc-bot button{height:70px;font-size:24px;margin-left:12px}
.fbar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);margin:14px 0 12px;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:6px;background:rgba(255,255,255,.45)}
.late .fbar i{background:#A78BFA}
.paid .fbar i{background:#4ade80}
.fc-when{font-size:26px;font-weight:700}
.late .fc-when{color:#cbb8ff}
.paid .fc-when{color:#4ade80}

var DEFAULTS = {demi:300, jour:500, horaire:80, horaireSup:50, taux:60, retours:25, nuit:25, weekend:30, urgence:30, uber:30, marge:32, photo:'', urssaf:24, remiseMax:15};

function num(v){
  if (v === null || v === undefined) return 0;
  var n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : 0;
}

function easter(y){
  var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return [mo, da];
}

var FIXED = {'1-1':'Jour de l’an','5-1':'Fête du travail','5-8':'8 mai 1945','7-14':'Fête nationale',
             '8-15':'Assomption','11-1':'Toussaint','11-11':'Armistice','12-25':'Noël'};

function holidayName(y, mo, d){
  var key = mo + '-' + d;
  if (FIXED[key]) return FIXED[key];
  var e = easter(y);
  var diff = Math.round((Date.UTC(y, mo-1, d) - Date.UTC(y, e[0]-1, e[1])) / 86400000);
  if (diff === 1) return 'Lundi de Pâques';
  if (diff === 39) return 'Ascension';
  if (diff === 50) return 'Lundi de Pentecôte';
  return null;
}

/* dateStr = "AAAA-MM-JJ" */
function dayInfo(dateStr){
  var r = {valid:false, weekend:false, ferie:null, dow:-1};
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return r;
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo-1, d);
  r.valid = true;
  r.dow = dt.getDay();
  r.weekend = (r.dow === 0 || r.dow === 6);
  r.ferie = holidayName(y, mo, d);
  return r;
}

/* Tournage à l'heure : 1-3 h au tarif horaire (80 €), 4 h = demi-journée (300 €), puis +50 € par heure (8 h = 500 €) */
function hoursPrice(h, st){
  if (h <= 0) return 0;
  if (h < 4) return h * num(st.horaire);
  return num(st.demi) + (h - 4) * num(st.horaireSup);
}
function hoursTier(h){ return h === 8 ? 'journée' : (h === 4 ? 'demi-journée' : ''); }
function dayHours(day){ return day.heures !== undefined ? num(day.heures) : num(day.jour) * 8 + num(day.demi) * 4; }

function dayCalc(day, st){
  var base = day.heures === undefined ? num(day.demi) * num(st.demi) + num(day.jour) * num(st.jour) : hoursPrice(num(day.heures), st);
  var info = dayInfo(day.date);
  var maj = 0;
  if (info.ferie) maj += num(st.weekend) / 100; /* week-end = prix normal ; seul le férié est majoré (réglage « weekend ») */
  if (day.nuit) maj += num(st.nuit) / 100;
  var prix = base * (1 + maj);
  var photo = day.photo ? num(st.photo) : 0;
  return {base:base, maj:maj, prix:prix, photo:photo, total:prix + photo, info:info};
}

function fraisBilled(reel, marge){ return num(reel) * (1 + num(marge) / 100); }

function montageCalc(dv, st){
  var h = num(dv.heures);
  var base = h * (1 + num(st.retours) / 100) * num(st.taux);
  var urg = dv.urgence ? base * num(st.urgence) / 100 : 0;
  return {heures:h, base:base, urgence:urg, total:base + urg};
}

function calcDevis(dv, st){
  var lines = [], brut = 0, reels = 0, i;
  var tournage = 0;
  for (i = 0; i < dv.days.length; i++){
    var c = dayCalc(dv.days[i], st);
    tournage += c.total;
    if (c.prix > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + dayDesc(dv.days[i], c), amount:c.prix});
    if (c.photo > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + ' — photo', amount:c.photo});
  }
  var frais = 0;
  for (i = 0; i < dv.frais.length; i++){
    var f = dv.frais[i];
    var b = fraisBilled(f.reel, f.marge);
    frais += b; reels += num(f.reel);
    lines.push({g:'Frais', label:f.label + ' (' + Math.round(num(f.reel)) + ' € + ' + num(f.marge) + ' %)', amount:b});
  }
  var trajReel = num(dv.trajets) * num(st.uber);
  if (trajReel > 0){
    var tb = fraisBilled(trajReel, st.marge);
    frais += tb; reels += trajReel;
    lines.push({g:'Frais', label:'Trajets × ' + num(dv.trajets) + ' (' + Math.round(trajReel) + ' € + ' + num(st.marge) + ' %)', amount:tb});
  }
  var mo = montageCalc(dv, st);
  if (mo.base > 0) lines.push({g:'Montage', label:'Montage ' + mo.heures + ' h', amount:mo.base});
  if (mo.urgence > 0) lines.push({g:'Montage', label:'Urgence < 48h (+' + num(st.urgence) + ' %)', amount:mo.urgence});
  brut = tournage + frais + mo.total;
  var urssaf = brut * num(st.urssaf) / 100;
  return {lines:lines, tournage:tournage, frais:frais, montage:mo.total, brut:brut, urssaf:urssaf, reels:reels, net:brut - urssaf - reels};
}

/* Négociation (page Résultat) : arrondi à la cinquantaine supérieure, marge de négo +5 %, remise en %.
   Plancher = prix normal − « Remise max acceptée » ; en dessous, le devis n'est pas rentable. */
function negoCalc(r, dv, st){
  var base = r.brut, ann = base;
  if (dv.nego) ann = Math.round(ann * 105) / 100;
  ann = dv.arrondi ? Math.ceil(Math.round(ann) / 50) * 50 : Math.round(ann);
  var pct = num(dv.remise), client = Math.round(ann * (100 - pct) / 100);
  if (dv.arrondi && pct) client = Math.floor(client / 10) * 10;
  var rem = ann - client;
  var urs = client * num(st.urssaf) / 100, net = client - urs - r.reels;
  var plancher = Math.round(base * (1 - num(st.remiseMax) / 100));
  return {actif:!!(dv.nego || dv.arrondi || pct), base:base, annonce:ann, pct:pct, remise:rem, client:client, urssaf:urs, net:net,
    diffNet:net - r.net, plancher:plancher, sous:client < plancher, totalPct:base ? Math.round((1 - client / base) * 100) : 0};
}

function dayDesc(day, c){
  var p = [];
  if (day.heures !== undefined){ var hh = num(day.heures); if (hh) p.push(hh + ' h' + (hoursTier(hh) ? ', ' + hoursTier(hh) : '')); }
  else {
    if (num(day.jour)) p.push(num(day.jour) + ' j');
    if (num(day.demi)) p.push(num(day.demi) + ' ½ j');
  }
  var s = p.length ? ' — ' + p.join(' + ') : '';
  if (c.info.ferie) s += ', férié';
  if (day.nuit) s += ', nuit';
  return s;
}

var MUSIC_RELAY = 'https://ntfy.sh/noam-musique-2ccbb2035061ec467497';
var LOFI = 'https://www.youtube.com/watch?v=rFZHOHl-L8A';
var musicBusy = false;
function playMusic(){
  if (musicBusy) return;
  musicBusy = true;
  var tile = $('hm-tile'), fini = false;
  if (tile) tile.className = 'wtile wait';
  function end(ok){
    if (fini) return; fini = true; musicBusy = false;
    var t = $('hm-tile');
    if (ok){ if (t){ t.className = 'wtile ok'; setTimeout(function(){ var u = $('hm-tile'); if (u) u.className = 'wtile'; }, 2500); } }
    else {
      if (t) t.className = 'wtile';
      askConfirm('Le Mac ne répond pas (éteint ou en veille ?). Ouvrir le live sur l’iPad ?', 'Ouvrir', function(){ window.open(data.musicUrl || LOFI, '_blank'); });
    }
  }
  setTimeout(function(){ end(false); }, 6000);
  try {
    var x = new XMLHttpRequest();
    x.open('POST', MUSIC_RELAY, true);
    x.onload = function(){ end(x.status >= 200 && x.status < 300); };
    x.onerror = function(){ end(false); };
    x.send(data.musicUrl || 'lofi');
  } catch(e){ end(false); }
}

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function eur(x){
  var n = Math.round(num(x));
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + s + ' €';
}
function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

var lastActivity = Date.now();
var lastHM = '', lastDate = '', lastGreet = '';
var lastDay = isoDate(new Date());
function tick(){
  var now = new Date(), hr = now.getHours();
  if (isoDate(now) !== lastDay){ lastDay = isoDate(now); tView = null; if (data.tasksCache) refreshTasks(); }
  var hm = pad(hr) + ':' + pad(now.getMinutes());
  if (hm !== lastHM){ $('clock').textContent = hm; lastHM = hm; }
  var ds = cap(JOURS[now.getDay()]) + ' ' + (now.getDate() === 1 ? '1er' : now.getDate()) + ' ' + MOIS[now.getMonth()];
  if (ds !== lastDate){ $('date').textContent = ds; lastDate = ds; }
  var gr = (hr >= 5 && hr < 18) ? 'Bonjour Noam' : 'Bonsoir Noam';
  if (gr !== lastGreet){ $('greet').textContent = gr; lastGreet = gr; }
  if (Date.now() - facLoadedAt > 300000){ loadFactures(); facPush(); }
  if ((current === 'taches' || current === 'planning') && Date.now() - tasksLoadedAt > (ghToken() ? 60000 : 300000)) loadTasks(function(){ if (current === 'taches') renderTaches(); if (current === 'planning') renderPlanning(); });
  if (Date.now() - lastActivity > IDLE_MS){
    lastActivity = Date.now();
    /* Projets / Planning : on reste dessus (pas de retour auto à l'accueil) */
    if (current !== 'taches' && current !== 'planning' && (current !== 'home' || modalOpen() || confirmOpen())){
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      closeModal(); closeConfirm();
      homePg = 0;
      go('home');

/* ---------- Suivi des factures ----------
   Source : ../data/factures.json, écrit UNIQUEMENT par la lecture facture.net (bouton ⟳ de l'écran, mac/lire-facturenet.md).
   Format : {updated, factures:[{id:'F26…', projet:client, brut, reste, entree:'AAAA-MM-JJ'}], encaisses:[{id, projet, montant, date}]}
   facture.net décide de ce qui est payé : pas de bouton « Payé » sur l'iPad.
   État décidé sur l'iPad : data.facEtat = {relances:{id:[ms…]}, payes:{id:ms}}, envoyé dans data/factures-etat.json
   (clé GitHub). La routine lit ce fichier : elle déplace les cartes payées dans « ✅ Payé & Archivé » et ajoute
   une tâche « relancer le paiement » (id relance-<6 derniers car. de l'id>-<AAAAMMJJ de l'échéance>) le jour venu.
   Relance due 15 jours après l'entrée dans la liste ou après la dernière relance. */
var facLireT = null, FAC_URL = '../data/factures.json', FAC_ETAT = 'data/factures-etat.json', facLoadedAt = 0, RELANCE_J = 15, facPushT = null, facBusy = false;

function parseIso(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }

function dCourt(ms){ var d = new Date(ms); return d.getDate() + ' ' + MOIS_C[d.getMonth()]; }
function ymd(ms){ var d = new Date(ms); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function loadFactures(){
  facLoadedAt = Date.now();
  try {
    var x = new XMLHttpRequest();
    x.open('GET', FAC_URL + '?t=' + Date.now(), true);
    x.onload = function(){
      if (x.status !== 200) return;
      try {
        var j = JSON.parse(x.responseText);
        if (!j || !(j.factures instanceof Array)) return;
        data.facCache = j;
        facPurge(); save(); renderFactures();
      } catch(e){}
    };
    x.send();
  } catch(e){}
  facPull();
}
/* Encaissé du mois = cartes passées dans « ✅ Payé & Archivé » ce mois-ci (liste "encaisses" de factures.json,
   écrite par la routine depuis Trello : {id, projet, montant, date:'AAAA-MM-JJ'})
   + factures cochées « Payé » sur l'iPad que la routine n'a pas encore déplacées. */
function facEncaisseMois(){
  var t = 0, now = new Date(), mois = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  var C = data.facCache || {}, enc = C.encaisses || [], i;
  for (i = 0; i < enc.length; i++)
    if (!enc[i].masque && String(enc[i].date || '').slice(0, 7) === mois) t += num(enc[i].montant);
  return t;
}
/* oublie relances / payés des cartes sorties de la liste (ex. déplacées dans Payé & Archivé) */
function facPurge(){
  if (!data.facCache) return;
  var ids = {}, l = data.facCache.factures, i, k, ch = false, E = data.facEtat;
  for (i = 0; i < l.length; i++) ids[l[i].id] = 1;
  for (k in E.relances) if (E.relances.hasOwnProperty(k) && !ids[k]){ delete E.relances[k]; ch = true; }
  for (k in E.payes) if (E.payes.hasOwnProperty(k) && !ids[k]){ delete E.payes[k]; ch = true; }
  for (k in (E.envoi || {})) if (E.envoi.hasOwnProperty(k) && !ids[k]){ delete E.envoi[k]; ch = true; }
  if (ch) facSchedule();
}
/* avec la clé : reprend l'état enregistré sur GitHub (sauf si des changements locaux attendent d'être envoyés) */
function facPull(){
  if (!ghToken() || facBusy) return;
  if (data.facDirty){ facPush(); return; }
  ghReqAt(FAC_ETAT, 'GET', null, function(ok, j){
    if (!ok || !j || !j.content || data.facDirty) return;
    try {
      var e = JSON.parse(b64dec(j.content));
      data.facEtat = {relances:e.relances || {}, payes:e.payes || {}, encaisses:e.encaisses || {}, delais:e.delais || {}, prochaine:e.prochaine || {}, envoi:e.envoi || {}, promis:e.promis || {}};
      facPurge(); save(); renderFactures();
    } catch(er){}
  });
}
function facSchedule(){ data.facDirty = true; save(); clearTimeout(facPushT); facPushT = setTimeout(facPush, 1500); }
function facPush(){
  if (facBusy || !ghToken() || !data.facDirty) return;
  facBusy = true;
  ghReqAt(FAC_ETAT, 'GET', null, function(ok, j, st){
    if (!ok && st !== 404){ facBusy = false; return; }
    var sent = JSON.stringify(data.facEtat);
    var body = {message:'iPad · Factures', content:b64enc(JSON.stringify(data.facEtat, null, 1) + '\n'), branch:'main'};
    if (ok && j && j.sha) body.sha = j.sha;
    ghReqAt(FAC_ETAT, 'PUT', body, function(ok2, j2, st2){
      facBusy = false;
      if (ok2){ if (JSON.stringify(data.facEtat) === sent){ data.facDirty = false; save(); } else facSchedule(); }
      else if (st2 === 409) setTimeout(facPush, 1500);

}
function facRows(){
  var list = (data.facCache && data.facCache.factures) || [], out = [], today = dayStart(new Date()), E = data.facEtat;
  for (var i = 0; i < list.length; i++){
    var f = list[i], d = parseIso(f.entree);
    if (!d) continue;
    var ent = d.getTime();
    if (num((E.envoi || {})[f.id])) d = new Date(num(E.envoi[f.id]));
    var rels = E.relances[f.id] || [], last = rels.length ? num(rels[rels.length - 1]) : 0;
    var start = dayStart(d);
    if (last && dayStart(new Date(last)) > start) start = dayStart(new Date(last));
    var dl = num((E.delais || {})[f.id]) || RELANCE_J;

    var pr = parseIso((E.prochaine || {})[f.id]);
    if (pr){ due = pr; dl = Math.max(1, Math.round((dayStart(pr) - start) / 86400000)); }
    var days = Math.max(0, Math.round((today - dayStart(d)) / 86400000));

      paye:false, taskId:'relance-' + String(f.id).slice(-6) + '-' + ymd(due.getTime())});

function facRow(id){ var r = facRows(); for (var i = 0; i < r.length; i++) if (r[i].id === id) return r[i]; return null; }

/* coche (localement + semaine.json) la tâche « relancer le paiement » liée à cette facture, si elle existe */
function facTickTask(r){

/* Glisser à gauche sur une facture : « Annuler » défait la dernière action, « Délai » règle le rythme de relance */

/* relances : la dernière à la date choisie ; les précédentes gardées (les plus récentes),

function facRelList(id, last, nb, envAgo){
  var old = (data.facEtat.relances[id] || []).slice(0, -1), prev = [], i;

/* ---------- Pipeline : les projets Trello par étape (lecture seule) ----------
   Source : ../data/production.json, écrit par la routine planning-semaine et « Lire Trello »
   ({projets:[{carte_id, projet, nom, montant, facture_a, liste, tournage, deadline, videos:[{nom, etat}]}]}).
   L'iPad n'appelle jamais Trello (la page est publique). « À facturer » = liste « 📝 Facture à faire ». */
var PIPE_URL = '../data/production.json', pipeLoadedAt = 0;
var PIPE_COLS = [['tourner', '🎥', 'À tourner'], ['prod', '🎬', 'En production'], ['attente', '⏳', 'Attente retour'], ['fact', '📝', 'À facturer']];
function pipeCol(l){ l = String(l || '').toLowerCase(); if (/factur/.test(l)) return 'fact'; if (/pause/.test(l)) return 'pause'; if (/attente/.test(l)) return 'attente'; if (/tourner/.test(l)) return 'tourner'; return 'prod'; }
function pipeItems(){
  var P = (data.pipeCache && data.pipeCache.projets) || [], out = [], i, p, nm, m, k;
  for (i = 0; i < P.length; i++){
    p = P[i]; nm = String(p.nom || p.projet || '');
    k = nm.indexOf(' > ');
    m = /\s*-\s*[\d\s.,]+\s*€\s*$/.exec(nm); if (m) nm = nm.slice(0, m.index);
    out.push({id:p.carte_id, col:pipeCol(p.liste), client:k > 0 ? nm.slice(0, k) : '', titre:k > 0 ? nm.slice(k + 3) : nm, montant:num(p.montant), paye:p.facture_a || '',
      tournage:p.tournage || '', deadline:p.deadline || '', liste:p.liste || '', videos:p.videos || [], tags:p.etiquettes || [],
      paye_tout:(p.etiquettes || []).join('|').indexOf('Paiement reçu') >= 0});
  }
  return out;
}
function pipeSums(){ var it = pipeItems(), s = {fact:0, cours:0, pause:0, npause:0}, i; for (i = 0; i < it.length; i++){ if (it[i].paye_tout){ if (it[i].col === 'pause') s.npause++; continue; } if (it[i].col === 'fact') s.fact += it[i].montant; else if (it[i].col === 'pause'){ s.pause += it[i].montant; s.npause++; } else s.cours += it[i].montant; } return s; }

  pipeLoadedAt = Date.now();
  try {
    var x = new XMLHttpRequest();
    x.open('GET', PIPE_URL + '?t=' + Date.now(), true);
    x.onload = function(){
      if (x.status !== 200) return;
      try { var j = JSON.parse(x.responseText); if (!j || !(j.projets instanceof Array)) return; data.pipeCache = j; save(); pipeWidget(); if (current === 'pipeline') renderPipeline(); } catch(e){}

/* Export texte pour facture.net : une ligne par prestation, montants arrondis à l'euro */
function devisExport(){
  var dv = data.devis, st = data.settings, L = [], A = [], i, tot = 0;
  function pr(x){ return Math.round(x) + ',00 €'; }
  function line(lbl, amt){ if (amt > 0.5){ A.push({l:lbl, v:Math.round(amt)}); tot += Math.round(amt); } }
  for (i = 0; i < dv.days.length; i++){
    var d = dv.days[i], c = dayCalc(d, st), hh = dayHours(d), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d.date || '');
    var opt = [hh + ' h' + (hoursTier(hh) ? ', ' + hoursTier(hh) : '')];
    if (c.info.ferie) opt.push('jour férié');
    if (d.nuit) opt.push('de nuit');
    line('Tournage' + (m ? ' du ' + m[3] + '/' + m[2] + '/' + m[1] : '') + ' (' + opt.join(', ') + ')', c.prix);
  }
  for (i = 0; i < dv.frais.length; i++) line(dv.frais[i].label, fraisBilled(dv.frais[i].reel, dv.frais[i].marge));
  if (num(dv.trajets)) line('Transport (' + num(dv.trajets) + ' trajet' + (num(dv.trajets) > 1 ? 's' : '') + ')', fraisBilled(num(dv.trajets) * num(st.uber), st.marge));
  var mo = montageCalc(dv, st);
  line('Montage vidéo (' + mo.heures + ' h, retours et export inclus)', mo.base);
  line('Livraison express', mo.urgence);
  /* négo / arrondi : les lignes sont ajustées au prorata pour tomber sur le prix annoncé, puis la remise est ajoutée */
  var n = negoCalc(calcDevis(dv, st), dv, st);
  if (A.length && n.annonce !== tot){
    var f = n.annonce / tot, s2 = 0, big = 0;
    for (i = 0; i < A.length; i++){ A[i].v = Math.round(A[i].v * f); s2 += A[i].v; if (A[i].v > A[big].v) big = i; }
    A[big].v += n.annonce - s2; tot = n.annonce;
  }
  for (i = 0; i < A.length; i++) L.push(A[i].l + ' · 1 · ' + pr(A[i].v));
  if (n.remise){ L.push('Remise commerciale (' + n.pct + ' %) · 1 · −' + pr(n.remise)); tot -= n.remise; }
  return 'Désignation · Quantité · Prix unitaire\n\n' + L.join('\n') + '\n\nTotal : ' + Math.round(tot) + ' €\nTVA non applicable, art. 293 B du CGI';
}

/* ---------- Projets (planning de la semaine) ----------
   Source unique : ../semaine.json, écrit par le Claude du planning de la semaine.
   Format : {updated, days:[{date:'AAAA-MM-JJ', jour:'Mercredi 11 novembre', tasks:[{id, client, text, done}]}]}
   Lu en XMLHttpRequest (à l'ouverture puis toutes les 5 min), gardé en cache hors ligne.
   Les coches restent sur l'iPad (par id). Journée finie -> les tâches des jours suivants remontent en « En avance ». */
var TASKS_URL = '../semaine.json', tasksLoadedAt = 0, tView = null;
/* Synchro des coches : avec une clé GitHub (Réglages), la page lit et écrit semaine.json via l'API GitHub.
   Sans clé : lecture via GitHub Pages, coches locales. La clé n'est jamais exportée (clé localStorage séparée). */
var GH = {owner:'noamodzproductions-cpu', repo:'ipad-dashboard', path:'semaine.json'}, GH_KEY = 'noamdash-gh', ghBusy = false, ghErr = '';
function ghToken(){ try { return window.localStorage.getItem(GH_KEY) || ''; } catch(e){ return ''; } }
function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function ghReq(method, body, cb){ ghReqAt(GH.path, method, body, cb); }
function ghReqAt(path, method, body, cb){
  try {
    var x = new XMLHttpRequest();
    x.open(method, 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + path + (method === 'GET' ? '?ref=main&t=' + Date.now() : ''), true);
    x.setRequestHeader('Authorization', 'token ' + ghToken());
    x.setRequestHeader('Accept', 'application/vnd.github.v3+json');
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){ var j = null; try { j = JSON.parse(x.responseText); } catch(e){} cb(x.status >= 200 && x.status < 300, j, x.status); };
    x.onerror = function(){ cb(false, null, 0); };
    x.send(body ? JSON.stringify(body) : null);
  } catch(e){ cb(false, null, 0); }
}
function gotWeek(w, cb){ data.tasksCache = applyEdits(w); save(); if (cb) cb(); pushPending(); }
function loadPages(cb){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', TASKS_URL + '?t=' + Date.now(), true);
    x.onload = function(){
      if (x.status !== 200) return;
      try { var j = JSON.parse(x.responseText); if (j && j.days) gotWeek(j, cb); } catch(e){}
    };
    x.send();
  } catch(e){}
}
function loadTasks(cb){
  tasksLoadedAt = Date.now();
  if (!ghToken()){ loadPages(cb); return; }
  ghReq('GET', null, function(ok, j, st){
    if (!ok || !j || !j.content){ ghErr = st === 401 ? 'Clé GitHub refusée' : 'GitHub injoignable'; loadPages(cb); return; }
    try { ghErr = ''; gotWeek(JSON.parse(b64dec(j.content)), cb); } catch(e){ loadPages(cb); }
  });
}
/* envoie les coches en attente (data.tasksDone) une par une dans semaine.json */
function pushPending(){
  if (ghBusy || !ghToken() || !data.tasksDone) return;
  var id = null;
  for (var k in data.tasksDone) if (data.tasksDone.hasOwnProperty(k)){ id = k; break; }
  if (id === null){ pushEdits(); return; }
  var val = !!data.tasksDone[id];
  ghBusy = true;
  ghReq('GET', null, function(ok, j){
    if (!ok || !j || !j.content){ ghBusy = false; return; }

var pg = null;

/* ---------- État des lectures Trello / WhatsApp (le Mac écrit sur le canal « -etat ») ---------- */
var LECT_RELAY = MUSIC_RELAY + '-etat', lectTimer = null;
function lectOf(k){ if (!data.lect) data.lect = {}; return data.lect[k] || {}; }
function lectSet(k, st, msg){
  if (!data.lect) data.lect = {};
  var o = data.lect[k] || {};
  if (st === 'wait') o = { t0: Date.now() };
  o.st = st; o.msg = msg || ''; o.t = Date.now(); data.lect[k] = o; save();
  if (st === 'ok' || st === 'err'){
    showToast((k === 'trello' ? 'Trello' : (k === 'frameio' ? 'Frame.io' : (k === 'facturenet' ? 'facture.net' : 'WhatsApp'))) + (st === 'ok' ? ' lu ✓' + (msg ? ' · ' + msg : '') : ' : ' + msg), null);
    /* facture.net : le fichier met ~1 min à arriver sur GitHub Pages → on relit plusieurs fois */
    if (st === 'ok' && k === 'facturenet'){ loadFactures(); setTimeout(loadFactures, 30000); setTimeout(loadFactures, 75000); setTimeout(loadFactures, 150000); }
    else if (st === 'ok'){ var rl = function(){ loadTasks(function(){ if (current === 'reglages') renderReglages(); if (current === 'taches') renderTaches(); }); }; rl(); setTimeout(rl, 75000); }
  }
  if (current === 'reglages') renderReglages();
  if (current === 'factures') renderFactures();
}
function lectLine(k, last){
  var o = lectOf(k), txt, col = '';
  if (o.st === 'wait' || o.st === 'run'){ txt = o.st === 'run' ? 'Lecture en cours…' : 'Demande envoyée au Mac…'; col = 'color:#A78BFA;'; }
  else if (o.st === 'err' && Date.now() - o.t < 6 * 3600000){ txt = 'Erreur : ' + o.msg; col = 'color:#fb923c;'; }
  else txt = last || '—';
  return '<div style="font-size:24px;' + col + '">' + esc(txt) + '</div>';
}
function lectPoll(){
  clearTimeout(lectTimer);
  var ks = ['trello', 'whatsapp', 'frameio', 'facturenet'], since = 0, busy = false, i, o;
  for (i = 0; i < ks.length; i++){ o = lectOf(ks[i]); if (o.st === 'wait' || o.st === 'run'){ busy = true; if (!since || o.t0 < since) since = o.t0; } }
  if (!busy) return;
  var x = new XMLHttpRequest();
  x.open('GET', LECT_RELAY + '/json?poll=1&since=' + Math.floor(since / 1000 - 5), true);
  x.onload = function(){
    var lines = (x.responseText || '').split('\n'), j, ev, p, k2, o2;
    for (j = 0; j < lines.length; j++){
      try { ev = JSON.parse(lines[j]); } catch(e){ continue; }
      if (!ev || ev.event !== 'message' || !ev.message) continue;
      p = String(ev.message).split('|'); k2 = p[0]; o2 = lectOf(k2);
      if (!(o2.st === 'wait' || o2.st === 'run') || ev.time * 1000 < o2.t0 - 5000) continue;
      if (p[1] === 'en cours' && o2.st === 'wait') lectSet(k2, 'run', '');
      else if (p[1] === 'ok') lectSet(k2, 'ok', p.slice(2).join('|'));
      else if (p[1] === 'erreur') lectSet(k2, 'err', p.slice(2).join('|') || 'Erreur inconnue');
    }
    lectCheck(); lectTimer = setTimeout(lectPoll, 4000);
  };
  x.onerror = function(){ lectCheck(); lectTimer = setTimeout(lectPoll, 8000); };
  x.send();
}
function lectCheck(){
  var ks = ['trello', 'whatsapp', 'frameio', 'facturenet'], i, o, now = Date.now();
  for (i = 0; i < ks.length; i++){
    o = lectOf(ks[i]);
    if (o.st === 'wait' && now - o.t0 > 45000) lectSet(ks[i], 'err', 'Le Mac ne répond pas (éteint ou en veille ?)');
    else if (o.st === 'run' && now - o.t0 > 17 * 60000) lectSet(ks[i], 'err', 'Pas de nouvelles du Mac depuis 17 min');
  }
}

      return;

    case 'tbset': a = arg.split('|'); window.__brandFor = null; setMeta(a[0], {client:a.slice(1).join('|')}); return;
    case 'tbnew': var bv = trimV('m-brand'); if (!bv) return; window.__brandFor = null; setMeta(arg, {client:bv}); return;

      if (window.__sub && window.__sub.a === arg && Date.now() - window.__sub.t < 380){
        var prev = window.__sub; window.__sub = null; clearTimeout(window.__subTm);
        a = arg.split('|'); var tsx = tSubOf(a[0]);

      var sd = null; for (i = 0; i < stc.length; i++) if (stc[i].id === a[1]) sd = stc[i];

      if (sd){ ts.chk[a[1]] = !sd.done; save(); }
      window.__subFrz = {id:a[0], ord:window.__subLast && window.__subLast.id === a[0] ? window.__subLast.ord : null};

  }
  tick();
}

function closestAttr(el, attr){
  while (el && el.nodeType === 1){ if (el.hasAttribute(attr)) return el; el = el.parentNode; }
  return null;
}

/* Appui long (projets) */
var lpTimer = null, lpFired = false, lpX = 0, lpY = 0, lpSwallowUntil = 0;
function lpStart(target, x, y){
  lpFired = false;
  var card = closestAttr(target, 'data-lp');
  clearTimeout(lpTimer);
  if (!card) return;
  lpX = x; lpY = y;
  var id = card.getAttribute('data-lp');
  lpTimer = setTimeout(function(){ lpFired = true; openProject(id); }, 650);
}
function lpMove(x, y){ if (Math.abs(x - lpX) > 12 || Math.abs(y - lpY) > 12) clearTimeout(lpTimer); }
function lpEnd(){ clearTimeout(lpTimer); if (lpFired){ lpFired = false; lpSwallowUntil = Date.now() + 400; } }

document.addEventListener('touchstart', function(e){ markActivity(); var t = e.touches[0]; lpStart(e.target, t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchmove', function(e){ var t = e.touches[0]; lpMove(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchend', lpEnd, {passive:true});
document.addEventListener('touchcancel', lpEnd, {passive:true});
document.addEventListener('mousedown', function(e){ markActivity(); lpStart(e.target, e.clientX, e.clientY); });
document.addEventListener('mousemove', function(e){ if (e.buttons) lpMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', lpEnd);
document.addEventListener('contextmenu', function(e){ if (closestAttr(e.target, 'data-lp')) e.preventDefault(); });
document.addEventListener('keydown', markActivity);
document.addEventListener('keydown', function(e){ if (e.keyCode === 13 && e.target && e.target.id === 'm-ttxt' && modal && modal.kind === 'tadd'){ e.preventDefault(); handle('tasave', ''); } });
document.addEventListener('keydown', function(e){ if (e.keyCode === 13 && e.target && (e.target.id === 'li-t' || e.target.id === 'li-p') && modal && modal.kind === 'litem'){ e.preventDefault(); if (e.target.id === 'li-t' && $('li-p') && !trimV('li-p')) $('li-p').focus(); else handle('litok', ''); } });
document.addEventListener('keydown', function(e){ if (e.keyCode === 13 && e.target && e.target.id === 'm-music'){ e.preventDefault(); e.target.blur(); handle('musave', ''); } });
document.addEventListener('change', function(e){ if (e.target && e.target.id === 'm-music') handle('musave', ''); });
document.addEventListener('change', function(e){ if (e.target && e.target.id === 'm-tbrand' && $('m-tbnew')){ var nw = e.target.value === '__new'; $('m-tbnew').style.display = nw ? 'block' : 'none'; if (nw) try { $('m-tbnew').focus(); } catch(er){} } });
/* factures : date d'envoi / de dernière relance choisies au calendrier */
document.addEventListener('change', function(e){
  var el = e.target; if (!el || (el.id !== 'f-env' && el.id !== 'f-rel' && el.id !== 'f-pro') || !modal || modal.kind !== 'fdelai') return;
  var d = parseIso(el.value), n = d ? Math.max(0, Math.round((dayStart(new Date()) - dayStart(d)) / 86400000)) : null;
  if (el.id === 'f-pro'){ if (d){ modal.pro = dayStart(d); modal.proCh = true; facDelai(modal.id, modal); } return; }
  if (el.id === 'f-env'){ if (n === null) return; modal.env = n; modal.chEnv = true; }
  else { modal.ago = n; modal.changed = true; fnbSync(); }
  facDelai(modal.id, modal);
});
document.addEventListener('keydown', function(e){ if (e.keyCode === 13 && e.target && e.target.id === 'm-brand' && modal && modal.kind === 'tdet'){ e.preventDefault(); handle('tbnew', modal.id); } });
document.addEventListener('keydown', function(e){ if (e.keyCode === 13 && e.target && e.target.id === 'm-sub' && modal && modal.kind === 'tdet'){ e.preventDefault(); handle('tsubadd', modal.id); } });
var sw0 = null, sw0m = false;
function swStart(t, x, y){ sw0 = {x:x, y:y, fid:closestAttr(t, 'data-fid')}; }
function swEnd(x, y){
  if (sw0 && modal && modal.kind === 'tdet' && sw0.fid && Date.now() > lpSwallowUntil){
    var mdx = x - sw0.x, mdy = y - sw0.y, mf = sw0.fid; sw0 = null;
    if (Math.abs(mdx) < 60 || Math.abs(mdx) < Math.abs(mdy) * 1.5) return;
    var mo = document.querySelectorAll('#modal .scard.open');
    for (var mi = 0; mi < mo.length; mi++) if (mo[mi] !== mf) mo[mi].classList.remove('open');
    mf.classList.toggle('open', mdx < 0); lpSwallowUntil = Date.now() + 400; return;
  }
  if (!sw0 || modalOpen() || confirmOpen()){ sw0 = null; return; }
  var dx = x - sw0.x, dy = y - sw0.y, f = sw0.fid; sw0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (current === 'home'){ if (sw0m) { setHomePage(dx < 0 ? 1 : 0); lpSwallowUntil = Date.now() + 400; } return; }
  if ((current === 'factures' || current === 'listes') && f){
    var all = document.querySelectorAll('#s-' + current + ' .fcard.open');
    for (var i = 0; i < all.length; i++) if (all[i] !== f) all[i].classList.remove('open');
    f.classList.toggle('open', dx < 0); lpSwallowUntil = Date.now() + 400;
  }
}
document.addEventListener('touchstart', function(e){ sw0m = false; var t = e.touches[0]; swStart(e.target, t.clientX, t.clientY); }, {passive:true});
/* Accueil : bascule immédiate — dès que le doigt part franchement sur le côté (~70 px), la page part vers l'autre */
var hs = null;
document.addEventListener('touchstart', function(e){
  if (current !== 'home' || modalOpen() || confirmOpen() || e.touches.length !== 1){ hs = null; return; }
  hs = {x:e.touches[0].clientX, y:e.touches[0].clientY, done:false};
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if (!hs || hs.done) return;
  var dx = e.touches[0].clientX - hs.x, dy = e.touches[0].clientY - hs.y;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
  hs.done = true; clearTimeout(lpTimer); lpSwallowUntil = Date.now() + 500;
  if (dx < 0 && !homePg) setHomePage(1); else if (dx > 0 && homePg) setHomePage(0);
}, {passive:true});
document.addEventListener('touchend', function(){ hs = null; }, {passive:true});
document.addEventListener('touchend', function(e){ var t = e.changedTouches[0]; swEnd(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('mousedown', function(e){ sw0m = true; swStart(e.target, e.clientX, e.clientY); });
document.addEventListener('mouseup', function(e){ swEnd(e.clientX, e.clientY); });
/* plus de blocage global du glisser : fond noir uni, chaque liste défile normalement */

document.addEventListener('click', function(e){
  markActivity();
  if (lpFired || Date.now() < lpSwallowUntil){ lpFired = false; lpSwallowUntil = 0; e.preventDefault(); e.stopPropagation(); return; }
  /* un champ en cours d'édition s'enregistre dès qu'on touche ailleurs */
  if (window.__inlFin && !(e.target && e.target.className === 'inl')) window.__inlFin();
  if (e.target === $('modal') && modal && modal.kind === 'tdet'){ handle('mfin2', ''); return; }
  var el = closestAttr(e.target, 'data-act');
  if (!el) return;
  handle(el.getAttribute('data-act'), el.getAttribute('data-arg') || '');
}, true);

document.addEventListener('input', function(e){
  markActivity();
  var t = e.target;
  if (t.hasAttribute('data-bind') && modal){ modal[t.getAttribute('data-bind')] = t.value; t.style.borderColor = ''; updatePreview(); }
  else if (t.hasAttribute('data-set')){ data.settings[t.getAttribute('data-set')] = t.value === '' ? '' : num(t.value); save(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.hasAttribute('data-day')){
    var d = data.devis.days[+t.getAttribute('data-day')];
    if (d){ d.date = t.value; save(); updateDevisLive(); }
  } else if (t.hasAttribute('data-set')){
    var k = t.getAttribute('data-set');
    if (t.value === '' && k !== 'photo'){ data.settings[k] = DEFAULTS[k]; t.value = DEFAULTS[k]; }
    else data.settings[k] = t.value === '' ? '' : num(t.value);
    save();
  }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ markActivity(); tick(); } });

/* ---------- Démarrage ---------- */
load();
var reopen = null;
try { reopen = window.localStorage.getItem('noamdash-reopen'); window.localStorage.removeItem('noamdash-reopen'); } catch(e){}
go(['taches','reglages','factures','materiel','devis','planning','listes','pipeline'].indexOf(reopen) >= 0 ? reopen : 'home');
loadTasks(null);
loadFactures();
setInterval(tick, 500);
lectPoll();
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  try { navigator.serviceWorker.register('sw.js'); } catch(e){}
}
})();
</script>
