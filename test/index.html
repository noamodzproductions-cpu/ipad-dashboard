<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash test">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dashboard Noam (test)</title>
<style>
/* Style : accueil-bento.html. iPad Air 1 / Safari 12 : pas de flou calculé, pas de filter,
   pas d'animation en boucle, transitions sur transform/opacity uniquement, pas de flex gap. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;width:100%;overflow:hidden}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:#fff;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);border-radius:9999px;min-height:70px;min-width:70px;font-size:26px;font-weight:600;padding:0 26px;-webkit-appearance:none;cursor:pointer;line-height:1.15}
button:active{opacity:.7}
button.white{background:#fff;color:#111;border-color:#fff}
button.vio{color:#cbb8ff}
[data-act]{cursor:pointer}
input,textarea{font-family:inherit;font-size:28px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.24);border-radius:16px;height:70px;padding:0 16px;-webkit-appearance:none;outline:none}
input:focus,textarea:focus{border-color:#fff}
input::-webkit-input-placeholder{color:rgba(255,255,255,.35)}
textarea{height:auto;font-size:15px;font-weight:400;padding:12px;width:100%;font-family:Menlo,monospace}
.hidden{display:none !important}
.row{display:flex;align-items:center}
.row > * + *{margin-left:14px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
.muted{color:rgba(255,255,255,.6)}
.inl{display:inline-block;width:22px;height:22px;vertical-align:-3px;margin-left:6px}

/* Verre dépoli SANS calcul : fond flouté (blur.jpg) calé une fois par alignGlass() */
.glass{position:relative;border-radius:28px;border:1px solid rgba(255,255,255,.16);background:#1c1c1e;overflow:hidden}
.glass.light{color:#111;border-color:#E9E9EC;background:#E9E9EC}
.card{padding:24px}
.tap:active{opacity:.8}
.label{font-size:17px;font-weight:600;color:rgba(255,255,255,.72);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.light .label{color:rgba(0,0,0,.55)}
.small{font-size:19px;color:rgba(255,255,255,.7);margin-top:6px}
.light .small{color:rgba(0,0,0,.6)}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:8px;vertical-align:1px}
.g{background:#4ade80}.v{background:#A78BFA}

/* Écrans */
.screen{position:absolute;top:20px;left:0;right:0;bottom:0;display:none;flex-direction:column;padding:12px 28px 18px}
.screen.active{display:flex}
.hdr{height:76px;flex-shrink:0;margin-bottom:16px}
.h1{font-size:36px;font-weight:600;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:19px;color:rgba(255,255,255,.7);margin-top:3px;white-space:nowrap}
.rbtn{width:70px;height:70px;padding:0;border-radius:35px}
.rbtn svg{display:block;width:30px;height:30px;margin:auto}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.foot{height:86px;margin-top:16px;flex-shrink:0}
.foot button{flex:1;height:86px;font-size:30px}
.empty{font-size:26px;color:rgba(255,255,255,.6);text-align:center;padding:30px 0}

/* Accueil : disposition de accueil-bento_1.html
   gauche = Suivi des factures (grande carte) ; droite haut = Devis + Projets ; droite bas = Musique */
.hclock{font-size:58px;font-weight:300;letter-spacing:-1px}
.widgets{flex:1;min-height:0;display:flex}
/* Accueil sur 2 pages : glisser à gauche / à droite */
.hpager{flex:1;min-height:0;overflow:hidden;position:relative}
.htrack{display:flex;width:200%;height:100%;transition:transform .25s ease-out;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
.htrack.p1{-webkit-transform:translate3d(-50%,0,0);transform:translate3d(-50%,0,0)}
.hpage{width:50%;height:100%;display:flex}
.hdots{flex-shrink:0;height:26px;padding-top:14px;text-align:center;white-space:nowrap;font-size:0}
.hdots span{display:inline-block;width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.3);margin:0 6px}
.hdots span.on{background:#fff}
.widgets2{align-items:flex-start}
.wsmall{flex:0 0 auto;width:300px;height:280px}
.bl{flex:1;min-width:0;display:flex}
.br{flex:1;min-width:0;margin-left:18px;display:flex;flex-direction:column}
.br-top{flex:1;min-height:0;display:flex}
.br-bot{flex:1;min-height:0;margin-top:18px;display:flex}
.widget{flex:1;min-width:0;padding:24px}
.br-top .widget + .widget{margin-left:18px}
.widget:active{opacity:.8}
.wtile{width:100px;height:100px;border-radius:30%;background:#fff;color:#111;padding:24px}
.wtile svg{display:block;width:52px;height:52px}
.light .wtile{background:#111;color:#fff}
.wtile.wait{opacity:.5}
.wtile.ok{background:#4ade80}
.wname{position:absolute;left:24px;bottom:22px;font-size:38px;font-weight:600;white-space:nowrap}
.chev{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.18)}
.chev svg{display:block;width:22px;height:22px;margin:13px auto}
.light .chev{background:#111;color:#A78BFA}

/* Interrupteurs iOS */
.tgl{position:relative;display:inline-block;width:64px;height:38px;border-radius:19px;background:rgba(255,255,255,.22)}
.tgl .knob{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:16px;background:#fff;transition:transform .2s}
.tgl.on{background:#4ade80}
.tgl.on .knob{transform:translateX(26px)}
.tgl.big{width:96px;height:56px;border-radius:28px}
.tgl.big .knob{top:4px;left:4px;width:48px;height:48px;border-radius:24px}
.tgl.big.on .knob{transform:translateX(40px)}
.tgl-hit{position:absolute;top:6px;right:6px;width:90px;height:70px;text-align:center;padding-top:16px}
.tgl-hit.big{position:static;width:120px;height:80px;padding-top:12px}

/* Suivi des factures (data/factures.json, rempli par la routine du planning) */
.fac{display:flex;flex-direction:column}
.fw-big{font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1;white-space:nowrap}
.fw-sub{font-size:24px;color:rgba(255,255,255,.7);margin-top:8px;white-space:nowrap}
.fw-sub b{color:#cbb8ff}
.fw-name{font-size:38px;font-weight:600;margin-top:18px;white-space:nowrap}
.ftots{margin:0 0 8px}
.fcard{display:block;padding:18px 22px;margin-bottom:14px;border-left:8px solid #1c1c1e}
/* glisser une facture à gauche : Annuler / Délai */
.fc-act{position:absolute;top:0;right:0;bottom:0;display:none;align-items:center;padding:0 18px;background:#2a2a2e;border-left:1px solid rgba(255,255,255,.16)}
.fcard.open .fc-act{display:flex}
.fc-act button{height:76px;font-size:24px}
.fc-act button + button{margin-left:12px}
/* Matériel */
.mcard{min-height:170px}
.mc-n{font-size:40px;font-weight:700;margin:8px 0}
.mc-l{font-size:19px;color:rgba(255,255,255,.6);line-height:1.3}
.mcard.done{border-color:#4ade80}
.mcard.done .mc-n{color:#4ade80}
.mchk{flex:1;min-width:0;display:block;text-align:left;height:84px;font-size:28px;padding:0 20px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchk .tchk{display:inline-block;vertical-align:middle;width:52px;height:52px;line-height:46px;margin:0 18px 0 0;border-radius:14px;font-size:28px}
.mchk.on{background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.5)}
.mchk.on .tchk{background:#4ade80;border-color:#4ade80}
.mrow2{margin-bottom:12px}
.mat{display:flex;overflow:hidden}
.mat-l{width:380px;flex-shrink:0;margin-right:18px;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mat-r{flex:1;min-width:0;padding:6px 18px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msel{display:block;width:100%;text-align:left;height:84px;font-size:27px;padding:0 18px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;background:transparent;border-color:rgba(255,255,255,.12)}
.msel .tchk{display:inline-block;vertical-align:middle;width:46px;height:46px;line-height:40px;margin:0 16px 0 0;border-radius:13px;font-size:26px}
.msel.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.msel.on .tchk{background:#fff;border-color:#fff;color:#111}
.msel .ed{float:right;font-size:22px;color:rgba(255,255,255,.55)}
.mgh{font-size:18px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px}
.mgh b{float:right}
.mgh.ok,.mgh.ok b{color:#4ade80}
.mat-r .mchk{width:100%;margin-bottom:10px}
.mready{padding:16px;text-align:center;font-size:28px;font-weight:700;color:#4ade80}
.mhint{font-size:24px;color:rgba(255,255,255,.55);text-align:center;padding:40px 10px;line-height:1.4}
.fc-top,.fc-bot{display:flex;align-items:center}
.fc-bot button{height:70px;font-size:24px;margin-left:12px}
.fbar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);margin:14px 0 12px;overflow:hidden}
.fbar i{display:block;height:100%;border-radius:6px;background:rgba(255,255,255,.45)}
.late .fbar i{background:#A78BFA}
.paid .fbar i{background:#4ade80}
.fc-when{font-size:26px;font-weight:700}
.late .fc-when{color:#cbb8ff}
.paid .fc-when{color:#4ade80}
.fc-hist{font-size:20px;color:rgba(255,255,255,.6);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard.late{border-left-color:#A78BFA}
.fc-n{font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-d{font-size:21px;color:rgba(255,255,255,.65);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late .fc-d{color:#cbb8ff;font-weight:600}
.fc-v{flex-shrink:0;margin-left:16px;font-size:40px;font-weight:700;white-space:nowrap}
.fcard.paid .fc-top,.fcard.paid .fc-hist{opacity:.45}
.fcard.paid .fc-v{text-decoration:line-through}
.fchk{display:flex;flex-shrink:0;margin-left:18px;padding-left:18px;border-left:1px solid rgba(255,255,255,.16)}
.fbox{position:relative;width:76px;height:76px;min-width:76px;padding:0;border-radius:20px;background:transparent;border:2px solid rgba(255,255,255,.18)}
.fbox + .fbox,.fbox-x + .fbox{margin-left:12px}
.fbox-x{display:block;width:76px;height:76px}
.fbox i{position:absolute;left:17px;top:17px;width:38px;height:38px;line-height:32px;border-radius:12px;border:3px solid rgba(255,255,255,.4);font-style:normal;font-size:24px;font-weight:800;text-align:center;color:#111}
.fhead{flex-shrink:0;height:24px;text-align:right;font-size:15px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.fhead span{display:inline-block;width:76px;text-align:center}
.fhead span + span{margin-left:12px;margin-right:24px}
.fbox.on.r{background:rgba(167,139,250,.22);border-color:#A78BFA;color:#d6c8ff}
.fbox.on.r i{background:#A78BFA;border-color:#A78BFA}
.fbox.on.p{background:rgba(74,222,128,.2);border-color:#4ade80;color:#4ade80}
.fbox.on.p i{background:#4ade80;border-color:#4ade80}
.fm-l{font-size:26px;color:rgba(255,255,255,.75);margin-bottom:10px}
.fm-l b{color:#fff}

/* Devis */
.dots{font-size:0;white-space:nowrap}
.dots span{display:inline-block;width:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.3);margin:0 5px}
.dots span.on{background:#fff;width:32px}
.bpill{height:70px;line-height:70px;padding:0 26px;border-radius:35px;background:#fff;color:#111;font-size:36px;font-weight:700;white-space:nowrap}
.bpill small{font-size:17px;color:rgba(0,0,0,.55);font-weight:600;margin-right:6px}
.day{padding:20px;margin-bottom:14px}
.dlabel{font-size:28px;font-weight:700;width:90px}
.dinput{width:240px;font-size:26px}
.badge{font-size:20px;font-weight:600;height:44px;line-height:44px;padding:0 16px;border-radius:22px;background:rgba(167,139,250,.25);color:#d6c8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
.dprice{font-size:44px;font-weight:700;white-space:nowrap}
.stp-l{font-size:18px;color:rgba(255,255,255,.65);margin-bottom:6px;white-space:nowrap}
.sb{width:76px;height:76px;padding:0;border-radius:38px;font-size:44px;font-weight:300}
.sv{min-width:72px;text-align:center;font-size:46px;font-weight:700}
.swrow{position:relative;display:block;width:280px;text-align:left;padding:0 96px 0 22px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swrow .tgl{position:absolute;right:14px;top:15px}
.swrow + .swrow{margin-top:10px}
.addday{width:100%;height:80px;font-size:28px;border:2px dashed rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.75)}
.fbtn{flex:1;height:110px;font-size:28px;border-radius:28px}
.fline{padding:14px 20px;margin-bottom:12px}
.fl{font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd{font-size:20px;color:rgba(255,255,255,.65);white-space:nowrap}
.fv{font-size:34px;font-weight:700;white-space:nowrap}
.xbtn{width:70px;padding:0;border-radius:35px;font-size:28px}
.pp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pp .sb{width:130px;height:130px;border-radius:65px;font-size:72px}
.pp .sv{min-width:220px;font-size:110px}
.pp-l{font-size:30px;color:rgba(255,255,255,.7);margin-bottom:12px}
.pp-f{font-size:28px;color:rgba(255,255,255,.7);margin:20px 0}
.pp .swrow{width:440px;font-size:26px}
.pp-t{font-size:58px;font-weight:700;margin-top:20px}
.res{display:flex;height:100%}
.res.withn{height:calc(100% - 86px)}
.nrow{height:72px;margin-bottom:14px}
.nrow button{height:72px;font-size:24px;padding:0 22px}
.nrow button.on{background:rgba(167,139,250,.25);border-color:#A78BFA;color:#d6c8ff}
.nrow .sv{min-width:110px;font-size:34px}
.nrow .sb{width:72px;height:72px}
.nl{font-size:20px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap}
.warn{margin-top:14px;padding:12px 16px;border-radius:16px;background:#A78BFA;color:#111;font-size:22px;font-weight:700;line-height:1.25}
.bv.sm{font-size:68px;letter-spacing:-2px;margin-bottom:2px}
.mid.sm{font-size:22px}
.ok-n{margin-top:14px;font-size:20px;color:rgba(0,0,0,.6);font-weight:600}
.res-l{width:480px;flex-shrink:0;margin-right:18px;padding:28px;display:flex;flex-direction:column;justify-content:center}
.res-r{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px}
.big-l{font-size:19px;font-weight:600;color:rgba(0,0,0,.55);text-transform:uppercase;letter-spacing:1px}
.bv{font-size:92px;font-weight:700;letter-spacing:-3px;line-height:1.05;margin-bottom:8px;white-space:nowrap}
.mid{font-size:27px;margin-bottom:6px;white-space:nowrap;color:rgba(0,0,0,.7)}
.dh{font-size:16px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-top:14px}
.dl{font-size:22px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.dl .grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{white-space:nowrap}

/* Projets */
.pgrid{display:flex;flex-wrap:wrap}
.pcard{width:32%;margin-right:2%;margin-bottom:16px;padding:20px}
.pcard:nth-child(3n){margin-right:0}
.pc-c{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-m{font-size:34px;font-weight:300;margin:4px 0 12px}
.pcard button{display:block;width:100%;font-size:24px}
.pcard button + button{margin-top:10px}
.ok{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.5);color:#4ade80}
.ko{background:rgba(167,139,250,.22);border-color:rgba(167,139,250,.5);color:#cbb8ff}
.tots{height:96px;margin-top:14px;flex-shrink:0}
.tot{flex:1;min-width:0;height:96px;padding:12px 16px;border-radius:24px}
.tot-l{font-size:15px;font-weight:600;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.tot-v{font-size:30px;font-weight:700;white-space:nowrap;margin-top:4px}

/* Projets = tâches du jour (taches.json, rempli par la routine Suivi) */
.task{display:flex;align-items:center;padding:16px 22px;margin-bottom:12px}
.task.urg{border-left:6px solid #A78BFA}
.task{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task.lift{z-index:5;border-color:#A78BFA}
.toast{position:fixed;left:50%;bottom:30px;width:620px;margin-left:-310px;display:flex;align-items:center;padding:10px 10px 10px 32px;border-radius:9999px;background:#fff;color:#111;font-size:26px;font-weight:600;z-index:60;opacity:0;transform:translateY(30px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{background:#111;border-color:#111;color:#A78BFA}
.tchk{flex-shrink:0;width:64px;height:64px;line-height:58px;text-align:center;border-radius:20px;border:3px solid rgba(255,255,255,.4);margin-right:22px;font-size:34px;font-weight:700;color:#111}
.task.on{opacity:.45}
.task{transition:opacity .25s}
.task.on .tchk{background:#4ade80;border-color:#4ade80}
.task.on .ttxt{text-decoration:line-through}
.ttag{display:inline-block;height:30px;line-height:30px;padding:0 12px;border-radius:15px;background:rgba(255,255,255,.16);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;white-space:nowrap}
.ttxt{font-size:26px;font-weight:500;line-height:1.25}
.tall{padding:28px;text-align:center;font-size:30px;font-weight:700;color:#4ade80;margin-bottom:12px}
.tdem{padding:20px 24px;margin-top:6px}
.tdem-l{font-size:22px;color:rgba(255,255,255,.75);line-height:1.5;margin-top:8px}
.wkbtn{margin-right:14px}
.wk{display:flex;align-items:center;width:100%;text-align:left;border-radius:20px;margin-top:10px;font-size:24px;font-weight:500;padding:0 24px}
.wk b{flex-shrink:0;margin-left:16px;font-size:20px;color:#cbb8ff}
.tupd{font-size:17px;text-align:center;margin-top:14px}

/* Réglages */
.sgrid{display:flex;flex-wrap:wrap}
.sitem{width:230px;margin-right:16px;margin-bottom:14px;height:124px;padding:14px 16px;border-radius:24px}
.sitem:nth-child(4n){margin-right:0}
.sitem-l{font-size:17px;font-weight:600;color:rgba(255,255,255,.7);height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem input{width:140px;font-size:32px;text-align:right}
.u{font-size:24px;color:rgba(255,255,255,.65)}
.ghrow{padding:14px 18px;margin-bottom:14px;border-radius:24px}

/* Fenêtres : fond flouté pré-calculé, sans backdrop-filter */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#000}
.overlay.show{display:block}
#confirm{z-index:60;background:rgba(0,0,0,.6)}
.mbox{max-width:900px;margin:0 auto;padding:48px 30px}

<script>
(function(){
'use strict';

/*CALC-START*/
var DEFAULTS = {demi:300, jour:500, horaire:80, horaireSup:50, taux:60, retours:25, nuit:25, weekend:30, urgence:30, uber:30, marge:32, photo:'', urssaf:24, remiseMax:15};

function num(v){
  if (v === null || v === undefined) return 0;
  var n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : 0;
}

function easter(y){
  var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return [mo, da];
}

var FIXED = {'1-1':'Jour de l’an','5-1':'Fête du travail','5-8':'8 mai 1945','7-14':'Fête nationale',
             '8-15':'Assomption','11-1':'Toussaint','11-11':'Armistice','12-25':'Noël'};

function holidayName(y, mo, d){
  var key = mo + '-' + d;
  if (FIXED[key]) return FIXED[key];
  var e = easter(y);
  var diff = Math.round((Date.UTC(y, mo-1, d) - Date.UTC(y, e[0]-1, e[1])) / 86400000);
  if (diff === 1) return 'Lundi de Pâques';
  if (diff === 39) return 'Ascension';
  if (diff === 50) return 'Lundi de Pentecôte';
  return null;
}

/* dateStr = "AAAA-MM-JJ" */
function dayInfo(dateStr){
  var r = {valid:false, weekend:false, ferie:null, dow:-1};
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return r;
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo-1, d);
  r.valid = true;
  r.dow = dt.getDay();
  r.weekend = (r.dow === 0 || r.dow === 6);
  r.ferie = holidayName(y, mo, d);
  return r;
}

/* Tournage à l'heure : 1-3 h au tarif horaire (80 €), 4 h = demi-journée (300 €), puis +50 € par heure (8 h = 500 €) */
function hoursPrice(h, st){
  if (h <= 0) return 0;
  if (h < 4) return h * num(st.horaire);
  return num(st.demi) + (h - 4) * num(st.horaireSup);
}
function hoursTier(h){ return h === 8 ? 'journée' : (h === 4 ? 'demi-journée' : ''); }
function dayHours(day){ return day.heures !== undefined ? num(day.heures) : num(day.jour) * 8 + num(day.demi) * 4; }

function dayCalc(day, st){
  var base = day.heures === undefined ? num(day.demi) * num(st.demi) + num(day.jour) * num(st.jour) : hoursPrice(num(day.heures), st);
  var info = dayInfo(day.date);
  var maj = 0;
  if (info.ferie) maj += num(st.weekend) / 100; /* week-end = prix normal ; seul le férié est majoré (réglage « weekend ») */
  if (day.nuit) maj += num(st.nuit) / 100;
  var prix = base * (1 + maj);
  var photo = day.photo ? num(st.photo) : 0;
  return {base:base, maj:maj, prix:prix, photo:photo, total:prix + photo, info:info};
}

function fraisBilled(reel, marge){ return num(reel) * (1 + num(marge) / 100); }

function montageCalc(dv, st){
  var h = num(dv.heures);
  var base = h * (1 + num(st.retours) / 100) * num(st.taux);
  var urg = dv.urgence ? base * num(st.urgence) / 100 : 0;
  return {heures:h, base:base, urgence:urg, total:base + urg};
}

function calcDevis(dv, st){
  var lines = [], brut = 0, reels = 0, i;
  var tournage = 0;
  for (i = 0; i < dv.days.length; i++){
    var c = dayCalc(dv.days[i], st);
    tournage += c.total;
    if (c.prix > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + dayDesc(dv.days[i], c), amount:c.prix});
    if (c.photo > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + ' — photo', amount:c.photo});
  }
  var frais = 0;
  for (i = 0; i < dv.frais.length; i++){
    var f = dv.frais[i];
    var b = fraisBilled(f.reel, f.marge);
    frais += b; reels += num(f.reel);
    lines.push({g:'Frais', label:f.label + ' (' + Math.round(num(f.reel)) + ' € + ' + num(f.marge) + ' %)', amount:b});
  }
  var trajReel = num(dv.trajets) * num(st.uber);
  if (trajReel > 0){
    var tb = fraisBilled(trajReel, st.marge);
    frais += tb; reels += trajReel;
    lines.push({g:'Frais', label:'Trajets × ' + num(dv.trajets) + ' (' + Math.round(trajReel) + ' € + ' + num(st.marge) + ' %)', amount:tb});
  }
  var mo = montageCalc(dv, st);
  if (mo.base > 0) lines.push({g:'Montage', label:'Montage ' + mo.heures + ' h', amount:mo.base});
  if (mo.urgence > 0) lines.push({g:'Montage', label:'Urgence < 48h (+' + num(st.urgence) + ' %)', amount:mo.urgence});
  brut = tournage + frais + mo.total;
  var urssaf = brut * num(st.urssaf) / 100;
  return {lines:lines, tournage:tournage, frais:frais, montage:mo.total, brut:brut, urssaf:urssaf, reels:reels, net:brut - urssaf - reels};
}

/* Négociation (page Résultat) : arrondi à la cinquantaine supérieure, marge de négo +5 %, remise en %.
   Plancher = prix normal − « Remise max acceptée » ; en dessous, le devis n'est pas rentable. */
function negoCalc(r, dv, st){
  var base = r.brut, ann = base;
  if (dv.nego) ann = Math.round(ann * 105) / 100;
  ann = dv.arrondi ? Math.ceil(Math.round(ann) / 50) * 50 : Math.round(ann);
  var pct = num(dv.remise), client = Math.round(ann * (100 - pct) / 100);
  if (dv.arrondi && pct) client = Math.floor(client / 10) * 10;
  var rem = ann - client;
  var urs = client * num(st.urssaf) / 100, net = client - urs - r.reels;
  var plancher = Math.round(base * (1 - num(st.remiseMax) / 100));
  return {actif:!!(dv.nego || dv.arrondi || pct), base:base, annonce:ann, pct:pct, remise:rem, client:client, urssaf:urs, net:net,
    diffNet:net - r.net, plancher:plancher, sous:client < plancher, totalPct:base ? Math.round((1 - client / base) * 100) : 0};
}

function dayDesc(day, c){
  var p = [];
  if (day.heures !== undefined){ var hh = num(day.heures); if (hh) p.push(hh + ' h' + (hoursTier(hh) ? ', ' + hoursTier(hh) : '')); }
  else {
    if (num(day.jour)) p.push(num(day.jour) + ' j');
    if (num(day.demi)) p.push(num(day.demi) + ' ½ j');
  }
  var s = p.length ? ' — ' + p.join(' + ') : '';
  if (c.info.ferie) s += ', férié';
  if (day.nuit) s += ', nuit';
  return s;
}
/*CALC-END*/

var KEY = 'noamdash-test'; /* données séparées de la version normale */
var MISSIONS = 'https://claude.ai/artifact/Ff3ZbqjcB6FYCZBsdPyeoW';
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var STATUTS = ['Tournage','Montage','V1','Retours','Livré'];
var PAGES = ['Tournage','Frais de prod','Post-prod','Résultat'];
var SET_DEFS = [
  ['demi','Demi-journée','€'], ['jour','Journée','€'], ['taux','Taux montage','€/h'], ['retours','Retours / export','%'],
  ['nuit','Majoration nuit','%'], ['weekend','Jour férié','%'], ['urgence','Urgence < 48h','%'], ['uber','Uber aller-retour','€'],
  ['marge','Marge frais','%'], ['remiseMax','Remise max acceptée','%'], ['horaire','Tournage 1-3 h','€/h'], ['horaireSup','Tournage heure en plus','€/h'], ['urssaf','Taux URSSAF','%']
];
var FRAIS_TYPES = {
  matos:{title:'Loc matos', lab:'Libellé', def:'Location matos', chips:[]},
  personne:{title:'Personne à payer', lab:'Nom / rôle', def:'Personne', chips:['Photographe','Cadreur','Ingé son','Assistant']},
  autre:{title:'Autre', lab:'Libellé', def:'Autre', chips:['Train','Hôtel','Repas','Autre']}
};
var IDLE_MS = 120000;
var IC = {
  back:'<path d="M15 18l-6-6 6-6"/>', prev:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  arrow:'<path d="M7 17L17 7M9 7h8v8"/>', cam:'<path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/>', reload:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', euro:'<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5M4 10.5h9M4 13.5h9"/>',
  check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 15h8"/>',
  fact:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'
};
/* Musique : le Mac (mac/musique.py) lance le live Lofi Girl ; sinon on propose de l'ouvrir sur l'iPad */
var MAC_MUSIC = 'http://MacBook-Pro-de-Noam.local:8765/lofi.gif';
var LOFI = 'https://www.youtube.com/watch?v=CwPCy1GLS38';
var musicBusy = false;
function playMusic(){
  if (musicBusy) return;
  musicBusy = true;
  var tile = $('hm-tile'), fini = false, img = new Image();
  if (tile) tile.className = 'wtile wait';
  function end(ok){
    if (fini) return; fini = true; musicBusy = false;
    var t = $('hm-tile');
    if (ok){ if (t){ t.className = 'wtile ok'; setTimeout(function(){ var u = $('hm-tile'); if (u) u.className = 'wtile'; }, 2500); } }
    else {
      if (t) t.className = 'wtile';
      askConfirm('Le Mac ne répond pas (éteint ou en veille ?). Ouvrir le live sur l’iPad ?', 'Ouvrir', function(){ window.open(LOFI, '_blank'); });
    }
  }
  img.onload = function(){ end(true); };
  img.onerror = function(){ end(false); };
  setTimeout(function(){ end(false); }, 6000);
  img.src = MAC_MUSIC + '?t=' + Date.now();
}
function ico(p, cls){ return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }

var $ = function(id){ return document.getElementById(id); };
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function eur(x){
  var n = Math.round(num(x));
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + s + ' €';
}
function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function setText(id, v){ var e = $(id); if (e && e.textContent !== v) e.textContent = v; }
function setCls(id, cls, on){ var e = $(id); if (e && e.classList.contains(cls) !== on) e.classList.toggle(cls, on); }

function newDay(){ return {date:isoDate(new Date()), nuit:false, heures:0, photo:false}; }
function newDevis(){ return {page:0, days:[newDay()], frais:[], trajets:0, heures:0, urgence:false, arrondi:false, nego:false, remise:0}; }

var data;
function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  var s = {}, k;
  for (k in DEFAULTS) s[k] = DEFAULTS[k];
  if (d.settings) for (k in d.settings) if (DEFAULTS.hasOwnProperty(k)) s[k] = d.settings[k];
  d.settings = s;
  if (!d.devis || !d.devis.days || !d.devis.days.length) d.devis = newDevis();
  if (!d.devis.frais) d.devis.frais = [];
  d.devis.page = Math.max(0, Math.min(3, num(d.devis.page)));
  if (!(d.projects instanceof Array)) d.projects = [];
  if (!d.sessions || typeof d.sessions !== 'object') d.sessions = {};
  delete d.chrono; delete d.chronoSel;
  if (!d.facEtat || typeof d.facEtat !== 'object') d.facEtat = {relances:{}, payes:{}};
  if (!d.facEtat.relances) d.facEtat.relances = {};
  if (!d.facEtat.payes) d.facEtat.payes = {};
  if (!d.facEtat.encaisses) d.facEtat.encaisses = {};
  if (!d.facEtat.delais) d.facEtat.delais = {};
  if (!(d.materiel instanceof Array)) d.materiel = [
    {id:'a7s3', nom:'A7S3', items:[{id:'a7s3-sd', nom:'Carte SD'}, {id:'a7s3-bat', nom:'Batteries'}, {id:'a7s3-obj', nom:'Objectif'}]},
    {id:'atomos', nom:'Atomos', items:[{id:'atomos-bat', nom:'Batterie'}]},
    {id:'stab', nom:'Stabilisateur', items:[{id:'stab-poignees', nom:'Poignées'}]}
  ];
  if (!d.matCheck || typeof d.matCheck !== 'object') d.matCheck = {};
  if (!d.matPris || typeof d.matPris !== 'object') d.matPris = {};
  if (!d.matV2){
    var oldSeed = true;
    for (var mi = 0; mi < d.materiel.length; mi++) if (['a7s3','atomos','stab'].indexOf(d.materiel[mi].id) < 0) oldSeed = false;
    if (oldSeed){
      d.materiel = [
        {id:'cam', nom:'Caméra (A7S3)', items:[{id:'cam-sd', nom:'Carte SD'}, {id:'cam-bat', nom:'Batteries'}, {id:'cam-obj', nom:'Objectif'}]},
        {id:'atomos', nom:'Atomos Ninja 5', items:[{id:'atomos-bat', nom:'Batterie'}]},
        {id:'stab', nom:'Stabilisateur', items:[{id:'stab-ronin', nom:'Ronin'}, {id:'stab-manche', nom:'Manche / trépied'}, {id:'stab-plaque', nom:'Plaque de dégagement rapide'}, {id:'stab-bras', nom:'Bras'}]},
        {id:'lum', nom:'Lumière', items:[]}
      ];
      d.matCheck = {};
    }
    d.matV2 = true;
  }
  if (d.relances){ for (var rk in d.relances) if (d.relances.hasOwnProperty(rk) && !d.facEtat.relances[rk]) d.facEtat.relances[rk] = [num(d.relances[rk])]; delete d.relances; }
  return d;
}
function load(){
  var raw = null;
  try { raw = window.localStorage.getItem(KEY) || window.localStorage.getItem('noamdash'); } catch(e){}
  try { data = normalize(raw ? JSON.parse(raw) : null); } catch(e){ data = normalize(null); }
}
function save(){ try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }

/* ---------- Verre dépoli : cale le fond flouté sur chaque carte (une fois par affichage) ---------- */
function alignGlass(scope){
  var els = (scope || document).querySelectorAll('.glass');
  for (var i = 0; i < els.length; i++){
    var r = els[i].getBoundingClientRect();
    if (!r.width) continue;
    els[i].style.backgroundPosition = '0 0, ' + (-Math.round(r.left + 1)) + 'px ' + (-Math.round(r.top + 1)) + 'px';
  }
}
var scrollT = null;
document.addEventListener('scroll', function(e){
  var t = e.target;
  clearTimeout(scrollT);
  scrollT = setTimeout(function(){ if (t && t.querySelectorAll) alignGlass(t); }, 120);
}, true);
window.addEventListener('resize', function(){ alignGlass($('s-' + current)); });

/* ---------- Navigation ---------- */
var current = 'home';
var viewMonth = monthKey(new Date());
function hdr(title, sub, right){
  return '<div class="hdr row"><button class="rbtn" data-act="go" data-arg="home" aria-label="Accueil">' + ico(IC.back) + '</button>' +
    '<div class="grow"><div class="h1">' + title + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right || '') + '</div>';
}
function go(name){
  if (name === 'projets' && current !== 'projets') viewMonth = monthKey(new Date());
  current = name;
  var ids = ['home','devis','projets','reglages','taches','factures','materiel'];
  for (var i = 0; i < ids.length; i++) $('s-' + ids[i]).className = 'screen' + (ids[i] === name ? ' active' : '');
  if (name === 'home') renderHome();
  if (name === 'devis') renderDevis();
  if (name === 'factures'){ renderFactures(); loadFactures(); }
  if (name === 'materiel'){ matEdit = false; renderMateriel(); }
  if (name === 'projets') renderProjets();
  if (name === 'reglages') renderReglages();
  if (name === 'taches'){ tView = isoDate(new Date()); renderTaches(); loadTasks(function(){ if (current === 'taches') renderTaches(); }); }
  tick();
}

/* ---------- Tick : seuls les textes, la poignée et les états changent ---------- */
var lastActivity = Date.now();
var lastHM = '', lastDate = '', lastGreet = '';
function tick(){
  var now = new Date(), hr = now.getHours();
  var hm = pad(hr) + ':' + pad(now.getMinutes());
  if (hm !== lastHM){ $('clock').textContent = hm; lastHM = hm; }
  var ds = cap(JOURS[now.getDay()]) + ' ' + (now.getDate() === 1 ? '1er' : now.getDate()) + ' ' + MOIS[now.getMonth()];
  if (ds !== lastDate){ $('date').textContent = ds; lastDate = ds; }
  var gr = (hr >= 5 && hr < 18) ? 'Bonjour Noam' : 'Bonsoir Noam';
  if (gr !== lastGreet){ $('greet').textContent = gr; lastGreet = gr; }
  if (Date.now() - facLoadedAt > 300000){ loadFactures(); facPush(); }
  if (current === 'taches' && Date.now() - tasksLoadedAt > (ghToken() ? 60000 : 300000)) loadTasks(function(){ if (current === 'taches') renderTaches(); });
  if (Date.now() - lastActivity > IDLE_MS){
    lastActivity = Date.now();
    if (current !== 'home' || modalOpen() || confirmOpen()){
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      closeModal(); closeConfirm();
      homePg = 0;
      go('home');
    }
  }
}
function markActivity(){ lastActivity = Date.now(); }

/* ---------- Accueil ---------- */
function monthProjects(mk){
  var r = {list:[], brut:0, paid:0};
  for (var i = 0; i < data.projects.length; i++){
    var p = data.projects[i];
    if (p.month !== mk) continue;
    r.list.push(p); r.brut += num(p.amount); if (p.paid) r.paid += num(p.amount);
  }
  return r;

/* ---------- Suivi des factures ----------
   Source : ../data/factures.json, écrit par la routine du planning (liste Trello « 🧾 Solde en attente »).
   Format : {updated, factures:[{id, projet, brut, reste, entree:'AAAA-MM-JJ'}]}
   État décidé sur l'iPad : data.facEtat = {relances:{id:[ms…]}, payes:{id:ms}}, envoyé dans data/factures-etat.json
   (clé GitHub). La routine lit ce fichier : elle déplace les cartes payées dans « ✅ Payé & Archivé » et ajoute
   une tâche « relancer le paiement » (id relance-<6 derniers car. de l'id>-<AAAAMMJJ de l'échéance>) le jour venu.
   Relance due 15 jours après l'entrée dans la liste ou après la dernière relance. */
var FAC_URL = '../data/factures.json', FAC_ETAT = 'data/factures-etat.json', facLoadedAt = 0, RELANCE_J = 15, facPushT = null, facBusy = false;
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function parseIso(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
var MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dCourt(ms){ var d = new Date(ms); return d.getDate() + ' ' + MOIS_C[d.getMonth()]; }
function ymd(ms){ var d = new Date(ms); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function loadFactures(){
  facLoadedAt = Date.now();
  try {
    var x = new XMLHttpRequest();
    x.open('GET', FAC_URL + '?t=' + Date.now(), true);
    x.onload = function(){
      if (x.status !== 200) return;
      try {
        var j = JSON.parse(x.responseText);
        if (!j || !(j.factures instanceof Array)) return;
        facSortis(data.facCache, j);
        data.facCache = j;
        facPurge(); save(); renderFactures();
      } catch(e){}
    };
    x.send();
  } catch(e){}
  facPull();
}
/* une carte sortie de « Solde en attente » (passée dans Payé & Archivé) compte comme encaissée ce jour-là */
function facSortis(oldC, newC){
  if (!oldC || !oldC.factures) return;
  var ids = {}, i, f, E = data.facEtat, ch = false;
  for (i = 0; i < newC.factures.length; i++) ids[newC.factures[i].id] = 1;
  for (i = 0; i < oldC.factures.length; i++){
    f = oldC.factures[i];
    if (!ids[f.id] && !E.encaisses[f.id]){ E.encaisses[f.id] = {v:num(f.reste), m:Date.now(), p:f.projet}; ch = true; }
  }
  var lim = Date.now() - 70 * 86400000, k;
  for (k in E.encaisses) if (E.encaisses.hasOwnProperty(k) && num(E.encaisses[k].m) < lim){ delete E.encaisses[k]; ch = true; }
  if (ch) facSchedule();
}
function facEncaisseMois(){
  var t = 0, now = new Date(), k, e, d, E = data.facEtat.encaisses;
  for (k in E) if (E.hasOwnProperty(k)){ e = E[k]; d = new Date(num(e.m)); if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) t += num(e.v); }
  return t;
}
/* oublie relances / payés des cartes sorties de la liste (ex. déplacées dans Payé & Archivé) */
function facPurge(){
  if (!data.facCache) return;
  var ids = {}, l = data.facCache.factures, i, k, ch = false, E = data.facEtat;
  for (i = 0; i < l.length; i++) ids[l[i].id] = 1;
  for (k in E.relances) if (E.relances.hasOwnProperty(k) && !ids[k]){ delete E.relances[k]; ch = true; }
  for (k in E.payes) if (E.payes.hasOwnProperty(k) && !ids[k]){ delete E.payes[k]; ch = true; }
  if (ch) facSchedule();
}
/* avec la clé : reprend l'état enregistré sur GitHub (sauf si des changements locaux attendent d'être envoyés) */
function facPull(){
  if (!ghToken() || facBusy) return;
  if (data.facDirty){ facPush(); return; }
  ghReqAt(FAC_ETAT, 'GET', null, function(ok, j){
    if (!ok || !j || !j.content || data.facDirty) return;
    try {
      var e = JSON.parse(b64dec(j.content));
      data.facEtat = {relances:e.relances || {}, payes:e.payes || {}, encaisses:e.encaisses || {}, delais:e.delais || {}};
      facPurge(); save(); renderFactures();
    } catch(er){}
  });
}
function facSchedule(){ data.facDirty = true; save(); clearTimeout(facPushT); facPushT = setTimeout(facPush, 1500); }
function facPush(){
  if (facBusy || !ghToken() || !data.facDirty) return;
  facBusy = true;
  ghReqAt(FAC_ETAT, 'GET', null, function(ok, j, st){
    if (!ok && st !== 404){ facBusy = false; return; }
    var sent = JSON.stringify(data.facEtat);
    var body = {message:'iPad · Factures', content:b64enc(JSON.stringify(data.facEtat, null, 1) + '\n'), branch:'main'};
    if (ok && j && j.sha) body.sha = j.sha;
    ghReqAt(FAC_ETAT, 'PUT', body, function(ok2, j2, st2){
      facBusy = false;
      if (ok2){ if (JSON.stringify(data.facEtat) === sent){ data.facDirty = false; save(); } else facSchedule(); }
      else if (st2 === 409) setTimeout(facPush, 1500);
    });
  });
}
function facRows(){
  var list = (data.facCache && data.facCache.factures) || [], out = [], today = dayStart(new Date()), E = data.facEtat;
  for (var i = 0; i < list.length; i++){
    var f = list[i], d = parseIso(f.entree);
    if (!d) continue;
    var rels = E.relances[f.id] || [], last = rels.length ? num(rels[rels.length - 1]) : 0;
    var start = dayStart(d);
    if (last && dayStart(new Date(last)) > start) start = dayStart(new Date(last));
    var dl = num((E.delais || {})[f.id]) || RELANCE_J;
    var due = new Date(start); due.setDate(due.getDate() + dl);
    var days = Math.max(0, Math.round((today - dayStart(d)) / 86400000));
    var left = Math.round((due.getTime() - today) / 86400000);
    out.push({id:f.id, projet:f.projet, reste:num(f.reste), entree:d.getTime(), days:days, left:left, last:last, nrel:rels.length, dl:dl,
      paye:!!E.payes[f.id], taskId:'relance-' + String(f.id).slice(-6) + '-' + ymd(due.getTime())});
  }
  out.sort(function(a, b){ return (a.paye - b.paye) || (a.left - b.left) || (a.entree - b.entree); });
  return out;
}
function facRow(id){ var r = facRows(); for (var i = 0; i < r.length; i++) if (r[i].id === id) return r[i]; return null; }
function facTotals(rows){
  var t = {tot:0, late:0};
  for (var i = 0; i < rows.length; i++){ if (rows[i].paye) continue; t.tot += rows[i].reste; if (rows[i].left <= 0) t.late++; }
  t.urs = Math.round(t.tot * 0.232); t.net = t.tot - t.urs;
  return t;
}
/* coche (localement + semaine.json) la tâche « relancer le paiement » liée à cette facture, si elle existe */
function facTickTask(r){
  if (!r || !findTask(r.taskId)) return;
  if (!data.tasksDone) data.tasksDone = {};
  data.tasksDone[r.taskId] = true; save(); pushPending();
}
function facRelance(id){
  var r = facRow(id); if (!r) return;
  facTickTask(r);
  var E = data.facEtat;
  if (!E.relances[id]) E.relances[id] = [];
  E.relances[id].push(Date.now());
  facSchedule(); renderFactures();
  showToast(r.projet + ' · relancé', function(){ facUnrelance(id); });
}
function facUnrelance(id){
  var a = data.facEtat.relances[id];
  if (!a || !a.length) return;
  a.pop(); if (!a.length) delete data.facEtat.relances[id];
  facSchedule(); renderFactures();
}
function facPaye(id, on){
  var r = facRow(id); if (!r) return;
  if (on){ data.facEtat.payes[id] = Date.now(); data.facEtat.encaisses[id] = {v:r.reste, m:Date.now(), p:r.projet}; facTickTask(r); }
  else { delete data.facEtat.payes[id]; delete data.facEtat.encaisses[id]; }
  facSchedule(); renderFactures();
  if (on) showToast(r.projet + ' · payé', function(){ facPaye(id, false); });
}

/* Export texte pour facture.net : une ligne par prestation, montants arrondis à l'euro */
function devisExport(){
  var dv = data.devis, st = data.settings, L = [], A = [], i, tot = 0;
  function pr(x){ return Math.round(x) + ',00 €'; }
  function line(lbl, amt){ if (amt > 0.5){ A.push({l:lbl, v:Math.round(amt)}); tot += Math.round(amt); } }
  for (i = 0; i < dv.days.length; i++){
    var d = dv.days[i], c = dayCalc(d, st), hh = dayHours(d), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d.date || '');
    var opt = [hh + ' h' + (hoursTier(hh) ? ', ' + hoursTier(hh) : '')];
    if (c.info.ferie) opt.push('jour férié');
    if (d.nuit) opt.push('de nuit');
    line('Tournage' + (m ? ' du ' + m[3] + '/' + m[2] + '/' + m[1] : '') + ' (' + opt.join(', ') + ')', c.prix);
  }
  for (i = 0; i < dv.frais.length; i++) line(dv.frais[i].label, fraisBilled(dv.frais[i].reel, dv.frais[i].marge));
  if (num(dv.trajets)) line('Transport (' + num(dv.trajets) + ' trajet' + (num(dv.trajets) > 1 ? 's' : '') + ')', fraisBilled(num(dv.trajets) * num(st.uber), st.marge));
  var mo = montageCalc(dv, st);
  line('Montage vidéo (' + mo.heures + ' h, retours et export inclus)', mo.base);
  line('Livraison express', mo.urgence);
  /* négo / arrondi : les lignes sont ajustées au prorata pour tomber sur le prix annoncé, puis la remise est ajoutée */
  var n = negoCalc(calcDevis(dv, st), dv, st);
  if (A.length && n.annonce !== tot){
    var f = n.annonce / tot, s2 = 0, big = 0;
    for (i = 0; i < A.length; i++){ A[i].v = Math.round(A[i].v * f); s2 += A[i].v; if (A[i].v > A[big].v) big = i; }
    A[big].v += n.annonce - s2; tot = n.annonce;
  }
  for (i = 0; i < A.length; i++) L.push(A[i].l + ' · 1 · ' + pr(A[i].v));
  if (n.remise){ L.push('Remise commerciale (' + n.pct + ' %) · 1 · −' + pr(n.remise)); tot -= n.remise; }
  return 'Désignation · Quantité · Prix unitaire\n\n' + L.join('\n') + '\n\nTotal : ' + Math.round(tot) + ' €\nTVA non applicable, art. 293 B du CGI';
}

/* ---------- Projets (planning de la semaine) ----------
   Source unique : ../semaine.json, écrit par le Claude du planning de la semaine.
   Format : {updated, days:[{date:'AAAA-MM-JJ', jour:'Mercredi 11 novembre', tasks:[{id, client, text, done}]}]}
   Lu en XMLHttpRequest (à l'ouverture puis toutes les 5 min), gardé en cache hors ligne.
   Les coches restent sur l'iPad (par id). Journée finie -> les tâches des jours suivants remontent en « En avance ». */
var TASKS_URL = '../semaine.json', tasksLoadedAt = 0, tView = null;
/* Synchro des coches : avec une clé GitHub (Réglages), la page lit et écrit semaine.json via l'API GitHub.
   Sans clé : lecture via GitHub Pages, coches locales. La clé n'est jamais exportée (clé localStorage séparée). */
var GH = {owner:'noamodzproductions-cpu', repo:'ipad-dashboard', path:'semaine.json'}, GH_KEY = 'noamdash-gh', ghBusy = false, ghErr = '';
function ghToken(){ try { return window.localStorage.getItem(GH_KEY) || ''; } catch(e){ return ''; } }
function b64dec(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g, '')))); }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function ghReq(method, body, cb){ ghReqAt(GH.path, method, body, cb); }
function ghReqAt(path, method, body, cb){
  try {
    var x = new XMLHttpRequest();
    x.open(method, 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + path + (method === 'GET' ? '?ref=main&t=' + Date.now() : ''), true);
    x.setRequestHeader('Authorization', 'token ' + ghToken());
    x.setRequestHeader('Accept', 'application/vnd.github.v3+json');
    if (body) x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){ var j = null; try { j = JSON.parse(x.responseText); } catch(e){} cb(x.status >= 200 && x.status < 300, j, x.status); };
    x.onerror = function(){ cb(false, null, 0); };
    x.send(body ? JSON.stringify(body) : null);
  } catch(e){ cb(false, null, 0); }
}
function gotWeek(w, cb){ data.tasksCache = applyEdits(w); save(); if (cb) cb(); pushPending(); }
function loadPages(cb){
  try {
    var x = new XMLHttpRequest();
    x.open('GET', TASKS_URL + '?t=' + Date.now(), true);
    x.onload = function(){
      if (x.status !== 200) return;
      try { var j = JSON.parse(x.responseText); if (j && j.days) gotWeek(j, cb); } catch(e){}
    };
    x.send();
  } catch(e){}
}
function loadTasks(cb){
  tasksLoadedAt = Date.now();
  if (!ghToken()){ loadPages(cb); return; }
  ghReq('GET', null, function(ok, j, st){
    if (!ok || !j || !j.content){ ghErr = st === 401 ? 'Clé GitHub refusée' : 'GitHub injoignable'; loadPages(cb); return; }
    try { ghErr = ''; gotWeek(JSON.parse(b64dec(j.content)), cb); } catch(e){ loadPages(cb); }
  });
}
/* envoie les coches en attente (data.tasksDone) une par une dans semaine.json */
function pushPending(){
  if (ghBusy || !ghToken() || !data.tasksDone) return;
  var id = null;
  for (var k in data.tasksDone) if (data.tasksDone.hasOwnProperty(k)){ id = k; break; }
  if (id === null){ pushEdits(); return; }
  var val = !!data.tasksDone[id];
  ghBusy = true;
  ghReq('GET', null, function(ok, j){
    if (!ok || !j || !j.content){ ghBusy = false; return; }
    var w;
    try { w = JSON.parse(b64dec(j.content)); } catch(e){ ghBusy = false; return; }
    var found = false, changed = false;
    for (var d = 0; d < (w.days || []).length; d++) for (var t = 0; t < w.days[d].tasks.length; t++){
      var tk = w.days[d].tasks[t];
      if (tk.id === id){ found = true; if (!!tk.done !== val){ tk.done = val; changed = true; } }
    }
    function next(){ delete data.tasksDone[id]; data.tasksCache = applyEdits(w); save(); ghBusy = false; if (current === 'taches') renderTaches(); pushPending(); }
    if (!found || !changed){ next(); return; }
    ghReq('PUT', {message:(val ? 'Fait : ' : 'À refaire : ') + id, content:b64enc(JSON.stringify(w, null, 1) + '\n'), sha:j.sha, branch:'main'}, function(ok2, j2, st2){
      if (ok2){ ghErr = ''; next(); }
      else { ghBusy = false; ghErr = st2 === 409 ? '' : 'Coche pas encore envoyée'; if (st2 === 409) setTimeout(pushPending, 1500); }
    });
  });
}
/* tâches à date fixe (rendez-vous « 16h30 · … », tournage, rushs → SSD) : jamais remontées en avance automatiquement */
var FIXE_RE = /^(URGENT\s*·\s*)?\d{1,2}h\d{0,2}\s*·|tournage|shooting/i;
function isFixe(tk){ return FIXE_RE.test(tk.text || '') || /-ssd$/.test(tk.id || ''); }
function isDoneTask(k){ var m = data.tasksDone || {}; return m.hasOwnProperty(k.id) ? !!m[k.id] : !!k.done; }

function renderTaches(){
  if (tGesture) return; /* pas de rafraîchissement pendant un glisser */
  var W = data.tasksCache, days = (W && W.days) ? W.days : [], today = isoDate(new Date()), i, j, idx = -1;
  if (!tView) tView = today;
  for (i = 0; i < days.length; i++) if (days[i].date === tView) idx = i;
  var day = idx >= 0 ? days[idx] : null, isToday = tView === today, todo = [], fait = [];
  if (day) for (i = 0; i < day.tasks.length; i++) (isDoneTask(day.tasks[i]) ? fait : todo).push(day.tasks[i]);
  var title = day ? day.jour : (isToday ? 'Aujourd’hui' : tView);
  var h = '<div class="hdr row"><button class="rbtn" data-act="go" data-arg="home" aria-label="Accueil">' + ico(IC.back) + '</button>' +
    '<div class="grow"><div class="h1">Projets</div><div class="sub">' + (isToday ? 'Aujourd’hui · ' : '') + esc(title) + '</div></div>' +
    '<button class="rbtn" data-act="reload" aria-label="Recharger">' + ico(IC.reload) + '</button>' +
    (isToday && W ? '<button class="rbtn wkbtn" data-act="twk" aria-label="Tâches de la semaine">' + ico(IC.cal) + '</button>' : '') +
    (day ? '<div class="bpill num">' + todo.length + '<small> / ' + day.tasks.length + '</small></div>' : '') + '</div><div class="content">';
  if (!W) h += '<div class="empty">Pas encore de planning.<br>Connecte l’iPad à Internet puis reviens ici.</div>';
  else {
    if (!day) h += '<div class="empty">Rien de prévu ce jour.</div>';
    else {
      if (!todo.length) h += '<div class="glass tall">Journée terminée ✓</div>';
      for (i = 0; i < todo.length; i++) h += taskCard(todo[i], day.date);
      /* journée finie : on remonte les tâches pas faites des jours suivants */
      if (isToday && !todo.length){
        for (j = idx + 1; j < days.length; j++){
          var next = [], nd = days[j];
          for (i = 0; i < nd.tasks.length; i++) if (!isFixe(nd.tasks[i])) next.push(nd.tasks[i]);

/* ---------- Modifs de Noam sur le planning ----------

   appui long = déplacer plus haut ou plus bas. Gardé sur l'iPad (data.tEdits, réappliqué à chaque
   chargement) et, avec la clé GitHub, écrit dans semaine.json : "supprimes":[ids], "perso":true

  for (k in e.mov) if (e.mov.hasOwnProperty(k)) applyOp(w, {op:'mov', id:k, v:e.mov[k].v});

/* gestes sur les tâches : glisser à gauche (supprimer) et appui long (ranger) */
var tg = null;

}
function tgStart(target, x, y){
  if (current !== 'taches' || modal) return;

  if (!el) return;
  var g = tg = {el:el, x0:x, y0:y, dx:0, mode:null};
  g.timer = setTimeout(function(){
    if (tg !== g || g.mode || /(^| )on( |$)/.test(el.className)) return;
    g.mode = 'drag'; tGesture = true; g.base = g.y0; el.className += ' lift';

}
function tgMove(x, y, e){
  var g = tg;
  if (!g) return;
  var dx = x - g.x0, dy = y - g.y0;
  if (!g.mode){
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
    clearTimeout(g.timer);

  if (box){
    var r = box.getBoundingClientRect(), sc = 0;
    if (y < r.top + 70) sc = -14; else if (y > r.bottom - 70) sc = 14;
    if (sc){ var b4 = box.scrollTop; box.scrollTop += sc; g.base -= box.scrollTop - b4; off = y - g.base; }
  }
  s = tSib(el, -1);
  if (s && off < -(s.offsetHeight + 12) / 2){ h = s.offsetHeight + 12; el.parentNode.insertBefore(el, s); g.base -= h; g.moved = true; }
  else { s = tSib(el, 1); if (s && off > (s.offsetHeight + 12) / 2){ h = s.offsetHeight + 12; el.parentNode.insertBefore(el, s.nextSibling); g.base += h; g.moved = true; } }

    } else {

  refreshTasks();
}

    case 'mreset': askConfirm('Tout remettre à zéro pour un nouveau tournage ?', 'Remettre à zéro', function(){ data.matCheck = {}; data.matPris = {}; save(); renderMateriel(); }); return;

    case 'ntog': dv[arg] = !dv[arg]; save(); renderDevis(); return;
    case 'nrem': dv.remise = Math.max(0, Math.min(50, num(dv.remise) + num(arg))); save(); renderDevis(); return;
    case 'dvnext': dv.page = Math.min(3, dv.page + 1); save(); renderDevis(); return;
    case 'dvprev': if (dv.page === 0){ go('home'); return; } dv.page--; save(); renderDevis(); return;
    case 'dvnew':
      askConfirm('Effacer ce devis et en commencer un nouveau ?', 'Effacer', function(){ data.devis = newDevis(); save(); renderDevis(); });
      return;
    case 'dvexp':
      openModal({kind:'export'}, '<div class="mtitle">Devis pour facture.net</div><div class="muted" style="font-size:22px;margin-bottom:14px">Copie et reporte chaque ligne dans facture.net (désignation · quantité · prix unitaire).</div>' +
        '<textarea id="m-txt" rows="14" readonly style="font-size:18px">' + esc(devisExport()) + '</textarea>' +
        '<div class="row mbtns" style="margin-top:20px"><button data-act="selall">Tout sélectionner / copier</button><button class="white" data-act="mclose">Fermer</button></div>');
      return;
    case 'dadd': dv.days.push(newDay()); save(); renderDevis();
      var ct = document.querySelector('#s-devis .content'); if (ct){ ct.scrollTop = ct.scrollHeight; alignGlass(ct); } return;
    case 'ddel': dv.days.splice(+arg, 1); save(); renderDevis(); return;
    case 'dstep':
      a = arg.split(':'); var day = dv.days[+a[1]];
      if (a[0] === 'heures' && day.heures === undefined){ day.heures = dayHours(day); day.demi = 0; day.jour = 0; }
      day[a[0]] = Math.max(0, num(day[a[0]]) + (+a[2])); save(); renderDevis(); return;
    case 'dtog': a = arg.split(':'); dv.days[+a[1]][a[0]] = !dv.days[+a[1]][a[0]]; save(); renderDevis(); return;
    case 'tstep': dv.trajets = Math.max(0, num(dv.trajets) + (+arg.split(':')[1])); save(); renderDevis(); return;
    case 'hstep': dv.heures = Math.max(0, num(dv.heures) + (+arg.split(':')[1])); save(); renderDevis(); return;
    case 'urg': dv.urgence = !dv.urgence; save(); renderDevis(); return;
    case 'fopen': openFrais(arg); return;
    case 'fdel': dv.frais.splice(+arg, 1); save(); renderDevis(); return;
    case 'mchip': if (modal){ modal.label = arg; $('m-label').value = arg; } return;
    case 'mmarge':
      if (!modal) return;
      modal.marge = Math.max(0, num(modal.marge) + (+arg)); $('m-marge').value = modal.marge; updatePreview(); return;
    case 'mclose': closeModal(); return;
    case 'fsave':
      if (!modal) return;
      if (num(modal.reel) <= 0){ $('m-reel').style.borderColor = '#A78BFA'; return; }
      dv.frais.push({type:modal.type, label:(modal.label || '').replace(/^\s+|\s+$/g, '') || FRAIS_TYPES[modal.type].def, reel:num(modal.reel), marge:num(modal.marge)});
      save(); closeModal(); renderDevis(); return;

    case 'tdone':
      var cur = findTask(arg);
      if (!cur) return;
      if (!data.tasksDone) data.tasksDone = {};
      var nowDone = !isDoneTask(cur);
      data.tasksDone[arg] = nowDone; save(); pushPending();
      /* cocher : la case se coche et la carte se grise tout de suite, puis la tâche descend */
      var tcard = nowDone ? document.querySelector('#s-taches [data-tid="' + arg + '"]') : null;
      if (tcard){
        tcard.classList.add('on'); tcard.classList.remove('urg');
        var tbx = tcard.querySelector('.tchk'); if (tbx) tbx.textContent = '✓';
        setTimeout(function(){ if (current === 'taches') renderTaches(); }, 650);
      } else renderTaches();
      return;
    case 'tday':
      /* jour précédent / suivant parmi les jours du planning (fonctionne même si le jour affiché n'y est pas) */
      var dd = (data.tasksCache && data.tasksCache.days) || [], cv = tView || isoDate(new Date()), pick = null;
      for (i = 0; i < dd.length; i++){
        if (+arg > 0 && dd[i].date > cv && (!pick || dd[i].date < pick)) pick = dd[i].date;
        if (+arg < 0 && dd[i].date < cv && (!pick || dd[i].date > pick)) pick = dd[i].date;
      }
      if (!pick) return;
      tView = pick; renderTaches(); var cc = document.querySelector('#s-taches .content'); if (cc) cc.scrollTop = 0; return;
    case 'ghsave':
      var tk = ($('gh-in').value || '').replace(/^\s+|\s+$/g, '');
      if (!tk) return;
      try { window.localStorage.setItem(GH_KEY, tk); } catch(e){}
      renderReglages(); loadTasks(null); return;
    case 'ghclear':
      try { window.localStorage.removeItem(GH_KEY); } catch(e){}
      renderReglages(); return;
    case 'pmonth': viewMonth = shiftMonth(viewMonth, +arg); renderProjets(); return;
    case 'padd': openProject(null); return;
    case 'pstat': i = findProject(arg); if (i < 0) return; p = data.projects[i]; p.status = (p.status + 1) % STATUTS.length; save(); renderProjets(); return;
    case 'ppaid': i = findProject(arg); if (i < 0) return; data.projects[i].paid = !data.projects[i].paid; save(); renderProjets(); return;
    case 'psave':
      if (!modal) return;
      var cl = (modal.client || '').replace(/^\s+|\s+$/g, '');
      if (!cl){ $('m-client').style.borderColor = '#A78BFA'; return; }
      if (modal.id){ i = findProject(modal.id); if (i >= 0){ data.projects[i].client = cl; data.projects[i].amount = num(modal.amount); } }
      else data.projects.push({id:Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36), month:viewMonth, client:cl, amount:num(modal.amount), status:0, paid:false});
      save(); closeModal(); renderProjets(); return;
    case 'pdel':
      if (!modal) return;
      var pid = modal.id;
      askConfirm('Supprimer ce projet ?', 'Supprimer', function(){ i = findProject(pid); if (i >= 0) data.projects.splice(i, 1); save(); closeModal(); renderProjets(); });
      return;

    case 'exp':
      openModal({kind:'export'}, '<div class="mtitle">Exporter</div><div class="muted" style="font-size:22px;margin-bottom:14px">Copie ce texte et garde-le (Notes, mail…).</div>' +
        '<textarea id="m-txt" rows="14" readonly>' + esc(JSON.stringify(data)) + '</textarea>' +
        '<div class="row mbtns" style="margin-top:20px"><button data-act="selall">Tout sélectionner / copier</button><button class="white" data-act="mclose">Fermer</button></div>');
      return;
    case 'selall':
      var ta = $('m-txt'); ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); } catch(e){}
      ta.setAttribute('readonly', 'readonly'); return;
    case 'imp':
      openModal({kind:'import'}, '<div class="mtitle">Importer</div><div class="muted" style="font-size:22px;margin-bottom:14px">Colle ici un texte exporté. Toutes les données actuelles seront remplacées.</div>' +
        '<textarea id="m-txt" rows="12"></textarea><div id="m-err" style="color:#cbb8ff;font-size:24px;margin-top:10px"></div>' +
        '<div class="row mbtns" style="margin-top:20px"><button data-act="mclose">Annuler</button><button class="white" data-act="impok">Importer</button></div>');
      return;
    case 'impok':
      var parsed = null;
      try { parsed = JSON.parse($('m-txt').value); } catch(e){}
      if (!parsed || typeof parsed !== 'object' || !parsed.settings){ $('m-err').textContent = 'Texte invalide.'; return; }
      askConfirm('Remplacer toutes les données par celles importées ?', 'Remplacer', function(){ data = normalize(parsed); save(); closeModal(); go('reglages'); });
      return;

    case 'cfyes': var cb = confirmCb; closeConfirm(); if (cb) cb(); return;
    case 'cfno': closeConfirm(); return;
  }
  tick();
}

function closestAttr(el, attr){
  while (el && el.nodeType === 1){ if (el.hasAttribute(attr)) return el; el = el.parentNode; }
  return null;
}

/* Appui long (projets) */
var lpTimer = null, lpFired = false, lpX = 0, lpY = 0, lpSwallowUntil = 0;
function lpStart(target, x, y){
  lpFired = false;
  var card = closestAttr(target, 'data-lp');
  clearTimeout(lpTimer);
  if (!card) return;
  lpX = x; lpY = y;
  var id = card.getAttribute('data-lp');
  lpTimer = setTimeout(function(){ lpFired = true; openProject(id); }, 650);
}
function lpMove(x, y){ if (Math.abs(x - lpX) > 12 || Math.abs(y - lpY) > 12) clearTimeout(lpTimer); }
function lpEnd(){ clearTimeout(lpTimer); if (lpFired){ lpFired = false; lpSwallowUntil = Date.now() + 400; } }

document.addEventListener('touchstart', function(e){ markActivity(); var t = e.touches[0]; lpStart(e.target, t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchmove', function(e){ var t = e.touches[0]; lpMove(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchend', lpEnd, {passive:true});
document.addEventListener('touchcancel', lpEnd, {passive:true});
document.addEventListener('mousedown', function(e){ markActivity(); lpStart(e.target, e.clientX, e.clientY); });
document.addEventListener('mousemove', function(e){ if (e.buttons) lpMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', lpEnd);
document.addEventListener('contextmenu', function(e){ if (closestAttr(e.target, 'data-lp')) e.preventDefault(); });
document.addEventListener('keydown', markActivity);
var sw0 = null, sw0m = false;
function swStart(t, x, y){ sw0 = {x:x, y:y, fid:closestAttr(t, 'data-fid')}; }
function swEnd(x, y){
  if (!sw0 || modalOpen() || confirmOpen()){ sw0 = null; return; }
  var dx = x - sw0.x, dy = y - sw0.y, f = sw0.fid; sw0 = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (current === 'home'){ if (sw0m) { setHomePage(dx < 0 ? 1 : 0); lpSwallowUntil = Date.now() + 400; } return; }
  if (current === 'factures' && f){
    var all = document.querySelectorAll('#s-factures .fcard.open');
    for (var i = 0; i < all.length; i++) if (all[i] !== f) all[i].classList.remove('open');
    f.classList.toggle('open', dx < 0); lpSwallowUntil = Date.now() + 400;
  }
}
document.addEventListener('touchstart', function(e){ sw0m = false; var t = e.touches[0]; swStart(e.target, t.clientX, t.clientY); }, {passive:true});
/* Accueil : la page suit le doigt pendant le glisser, puis se cale (seul transform change) */
var hd = null;
document.addEventListener('touchstart', function(e){
  if (current !== 'home' || modalOpen() || confirmOpen()) { hd = null; return; }
  var t = e.touches[0];
  hd = {x:t.clientX, y:t.clientY, w:$('hpager').offsetWidth, drag:false, dx:0};
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if (!hd) return;
  var t = e.touches[0], dx = t.clientX - hd.x, dy = t.clientY - hd.y;
  if (!hd.drag){
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    hd.drag = true; $('htrack').style.transition = 'none'; clearTimeout(lpTimer);
  }
  hd.dx = dx;
  var off = Math.max(-hd.w - 40, Math.min(40, (homePg ? -hd.w : 0) + dx)), tr = 'translate3d(' + off + 'px,0,0)';
  var s = $('htrack').style; s.webkitTransform = tr; s.transform = tr;
}, {passive:true});
document.addEventListener('touchend', function(){
  if (!hd || !hd.drag){ hd = null; return; }
  var n = homePg, s = $('htrack').style;
  if (hd.dx < -hd.w * 0.2) n = 1; else if (hd.dx > hd.w * 0.2) n = 0;
  s.transition = ''; s.webkitTransform = ''; s.transform = '';
  setHomePage(n); lpSwallowUntil = Date.now() + 400; hd = null;
}, {passive:true});
document.addEventListener('touchend', function(e){ var t = e.changedTouches[0]; swEnd(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('mousedown', function(e){ sw0m = true; swStart(e.target, e.clientX, e.clientY); });
document.addEventListener('mouseup', function(e){ swEnd(e.clientX, e.clientY); });
document.addEventListener('touchmove', function(e){
  var el = e.target;
  while (el && el.nodeType === 1){
    if (el.tagName === 'TEXTAREA') return;
    var c = el.className;
    if (typeof c === 'string' && /(^| )(content|res-r|overlay)( |$)/.test(c) && el.scrollHeight > el.clientHeight + 1) return;
    el = el.parentNode;
  }
  e.preventDefault();
}, {passive:false});

document.addEventListener('click', function(e){
  markActivity();
  if (lpFired || Date.now() < lpSwallowUntil){ lpFired = false; lpSwallowUntil = 0; e.preventDefault(); e.stopPropagation(); return; }
  var el = closestAttr(e.target, 'data-act');
  if (!el) return;
  handle(el.getAttribute('data-act'), el.getAttribute('data-arg') || '');
}, true);

document.addEventListener('input', function(e){
  markActivity();
  var t = e.target;
  if (t.hasAttribute('data-bind') && modal){ modal[t.getAttribute('data-bind')] = t.value; t.style.borderColor = ''; updatePreview(); }
  else if (t.hasAttribute('data-set')){ data.settings[t.getAttribute('data-set')] = t.value === '' ? '' : num(t.value); save(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.hasAttribute('data-day')){
    var d = data.devis.days[+t.getAttribute('data-day')];
    if (d){ d.date = t.value; save(); updateDevisLive(); }
  } else if (t.hasAttribute('data-set')){
    var k = t.getAttribute('data-set');
    if (t.value === '' && k !== 'photo'){ data.settings[k] = DEFAULTS[k]; t.value = DEFAULTS[k]; }
    else data.settings[k] = t.value === '' ? '' : num(t.value);
    save();
  }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ markActivity(); tick(); } });

/* ---------- Démarrage ---------- */
load();
var reopen = null;
try { reopen = window.localStorage.getItem('noamdash-reopen'); window.localStorage.removeItem('noamdash-reopen'); } catch(e){}
go(reopen === 'taches' ? 'taches' : 'home');
loadTasks(null);
loadFactures();
setInterval(tick, 500);
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  try { navigator.serviceWorker.register('sw.js'); } catch(e){}
}
})();
</script>
</body>
</html>
