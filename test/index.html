<style>
/* Style : accueil-bento.html. iPad Air 1 / Safari 12 : pas de flou calculé, pas de filter,

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}

html,body{height:100%;width:100%;overflow:hidden}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#0b0b0d url(bg.jpg) 0 0/1024px 768px no-repeat;color:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

button:active{opacity:.7}
button.white{background:#fff;color:#111;border-color:#fff}
button.vio{color:#cbb8ff}
[data-act]{cursor:pointer}
input,textarea{font-family:inherit;font-size:28px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.24);border-radius:16px;height:70px;padding:0 16px;-webkit-appearance:none;outline:none}
input:focus,textarea:focus{border-color:#fff}
input::-webkit-input-placeholder{color:rgba(255,255,255,.35)}
textarea{height:auto;font-size:15px;font-weight:400;padding:12px;width:100%;font-family:Menlo,monospace}
.hidden{display:none !important}
.row{display:flex;align-items:center}
.row > * + *{margin-left:14px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}

/* Verre dépoli SANS calcul : fond flouté (blur.jpg) calé une fois par alignGlass() */

.glass.light{color:#111;border-color:#E9E9EC;background-color:#E9E9EC;background-image:linear-gradient(rgba(240,240,243,.80),rgba(240,240,243,.80)),url(blur.jpg)}

/* Accueil : 3 widgets */

.widgets{flex:1;min-height:0;display:flex}
.widget{flex:1;min-width:0;margin-left:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.widget:first-child{margin-left:0}

/* Interrupteurs iOS */
.tgl{position:relative;display:inline-block;width:64px;height:38px;border-radius:19px;background:rgba(255,255,255,.22)}
.tgl .knob{position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:16px;background:#fff;transition:transform .2s}
.tgl.on{background:#4ade80}
.tgl.on .knob{transform:translateX(26px)}
.tgl.big{width:96px;height:56px;border-radius:28px}
.tgl.big .knob{top:4px;left:4px;width:48px;height:48px;border-radius:24px}
.tgl.big.on .knob{transform:translateX(40px)}
.tgl-hit{position:absolute;top:6px;right:6px;width:90px;height:70px;text-align:center;padding-top:16px}
.tgl-hit.big{position:static;width:120px;height:80px;padding-top:12px}

/* Anneau du chrono (SVG, seul stroke-dashoffset change) */

.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:rgba(255,255,255,.16)}
.ring .bar{stroke-linecap:round}
.flash .ring .track{stroke:rgba(0,0,0,.12)}

/* Devis */

.bpill{height:70px;line-height:70px;padding:0 26px;border-radius:35px;background:#fff;color:#111;font-size:36px;font-weight:700;white-space:nowrap}
.bpill small{font-size:17px;color:rgba(0,0,0,.55);font-weight:600;margin-right:6px}
.day{padding:20px;margin-bottom:14px}

.dinput{width:240px;font-size:26px}

.dprice{font-size:44px;font-weight:700;white-space:nowrap}
.stp-l{font-size:18px;color:rgba(255,255,255,.65);margin-bottom:6px;white-space:nowrap}
.sb{width:76px;height:76px;padding:0;border-radius:38px;font-size:44px;font-weight:300}
.sv{min-width:72px;text-align:center;font-size:46px;font-weight:700}
.swrow{position:relative;display:block;width:280px;text-align:left;padding:0 96px 0 22px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fbtn{flex:1;height:110px;font-size:28px;border-radius:28px}

.mid{font-size:27px;margin-bottom:6px;white-space:nowrap;color:rgba(0,0,0,.7)}

.dl{font-size:22px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14)}

/* Projets */
.pgrid{display:flex;flex-wrap:wrap}

.pcard:nth-child(3n){margin-right:0}

.pcard button{display:block;width:100%;font-size:24px}

.ok{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.5);color:#4ade80}

.tots{height:96px;margin-top:14px;flex-shrink:0}
.tot{flex:1;min-width:0;height:96px;padding:12px 16px;border-radius:24px}
.tot-l{font-size:15px;font-weight:600;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}

/* Réglages */
.sgrid{display:flex;flex-wrap:wrap}
.sitem{width:230px;margin-right:16px;margin-bottom:14px;height:124px;padding:14px 16px;border-radius:24px}

/* Fenêtres : fond flouté pré-calculé, sans backdrop-filter */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;background-color:#0b0b0d;background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url(blur.jpg);background-repeat:no-repeat;background-size:100% 100%,1024px 768px}
.overlay.show{display:block}
#confirm{z-index:60;background:rgba(0,0,0,.6)}
.mbox{max-width:900px;margin:0 auto;padding:48px 30px}
.mtitle{font-size:44px;font-weight:700;margin-bottom:28px}
.mrow{margin-bottom:20px}
.mrow label{display:block;font-size:22px;font-weight:600;color:rgba(255,255,255,.7);width:200px;flex-shrink:0}
.mrow input[type=text]{flex:1}
.mrow input[type=number]{width:220px;text-align:right}
.chip{height:70px;font-size:24px}

.cbox2{background:#1c1c1e;border:1px solid rgba(255,255,255,.24);border-radius:28px;max-width:680px;margin:200px auto 0;padding:36px}
.cbox2 .cmsg{font-size:34px;font-weight:600;margin-bottom:30px;text-align:center}

</style>

<body>

<section id="s-home" class="screen active">
  <div class="hdr row">
    <div class="grow"><div class="h1" id="greet">Bonjour Noam</div><div class="sub" id="date"></div></div>
    <div class="hclock num" id="clock">00:00</div>
    <button class="rbtn" data-act="go" data-arg="reglages" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<script>
(function(){
'use strict';

/*CALC-START*/
var DEFAULTS = {demi:300, jour:500, taux:60, retours:25, nuit:25, weekend:30, urgence:30, uber:30, marge:32, photo:'', urssaf:24};

function num(v){
  if (v === null || v === undefined) return 0;
  var n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : 0;
}

function easter(y){
  var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
      f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return [mo, da];
}

var FIXED = {'1-1':'Jour de l’an','5-1':'Fête du travail','5-8':'8 mai 1945','7-14':'Fête nationale',
             '8-15':'Assomption','11-1':'Toussaint','11-11':'Armistice','12-25':'Noël'};

function holidayName(y, mo, d){
  var key = mo + '-' + d;
  if (FIXED[key]) return FIXED[key];
  var e = easter(y);
  var diff = Math.round((Date.UTC(y, mo-1, d) - Date.UTC(y, e[0]-1, e[1])) / 86400000);
  if (diff === 1) return 'Lundi de Pâques';
  if (diff === 39) return 'Ascension';
  if (diff === 50) return 'Lundi de Pentecôte';
  return null;
}

/* dateStr = "AAAA-MM-JJ" */
function dayInfo(dateStr){
  var r = {valid:false, weekend:false, ferie:null, dow:-1};
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return r;
  var y = +m[1], mo = +m[2], d = +m[3];
  var dt = new Date(y, mo-1, d);
  r.valid = true;
  r.dow = dt.getDay();
  r.weekend = (r.dow === 0 || r.dow === 6);
  r.ferie = holidayName(y, mo, d);
  return r;
}

function dayCalc(day, st){
  var base = num(day.demi) * num(st.demi) + num(day.jour) * num(st.jour);
  var info = dayInfo(day.date);
  var maj = 0;
  if (info.ferie || info.weekend) maj += num(st.weekend) / 100;
  if (day.nuit) maj += num(st.nuit) / 100;
  var prix = base * (1 + maj);
  var photo = day.photo ? num(st.photo) : 0;
  return {base:base, maj:maj, prix:prix, photo:photo, total:prix + photo, info:info};
}

function fraisBilled(reel, marge){ return num(reel) * (1 + num(marge) / 100); }

function montageCalc(dv, st){
  var h = num(dv.heures);
  var base = h * (1 + num(st.retours) / 100) * num(st.taux);
  var urg = dv.urgence ? base * num(st.urgence) / 100 : 0;
  return {heures:h, base:base, urgence:urg, total:base + urg};
}

function calcDevis(dv, st){
  var lines = [], brut = 0, reels = 0, i;
  var tournage = 0;
  for (i = 0; i < dv.days.length; i++){
    var c = dayCalc(dv.days[i], st);
    tournage += c.total;
    if (c.prix > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + dayDesc(dv.days[i], c), amount:c.prix});
    if (c.photo > 0) lines.push({g:'Tournage', label:'Jour ' + (i+1) + ' — photo', amount:c.photo});
  }
  var frais = 0;
  for (i = 0; i < dv.frais.length; i++){
    var f = dv.frais[i];
    var b = fraisBilled(f.reel, f.marge);
    frais += b; reels += num(f.reel);
    lines.push({g:'Frais', label:f.label + ' (' + Math.round(num(f.reel)) + ' € + ' + num(f.marge) + ' %)', amount:b});
  }
  var trajReel = num(dv.trajets) * num(st.uber);
  if (trajReel > 0){
    var tb = fraisBilled(trajReel, st.marge);
    frais += tb; reels += trajReel;
    lines.push({g:'Frais', label:'Trajets × ' + num(dv.trajets) + ' (' + Math.round(trajReel) + ' € + ' + num(st.marge) + ' %)', amount:tb});
  }
  var mo = montageCalc(dv, st);
  if (mo.base > 0) lines.push({g:'Montage', label:'Montage ' + mo.heures + ' h', amount:mo.base});
  if (mo.urgence > 0) lines.push({g:'Montage', label:'Urgence < 48h (+' + num(st.urgence) + ' %)', amount:mo.urgence});
  brut = tournage + frais + mo.total;
  var urssaf = brut * num(st.urssaf) / 100;
  return {lines:lines, tournage:tournage, frais:frais, montage:mo.total, brut:brut, urssaf:urssaf, reels:reels, net:brut - urssaf - reels};
}

function dayDesc(day, c){
  var p = [];
  if (num(day.jour)) p.push(num(day.jour) + ' j');
  if (num(day.demi)) p.push(num(day.demi) + ' ½ j');
  var s = p.length ? ' — ' + p.join(' + ') : '';
  if (c.info.ferie) s += ', férié';
  else if (c.info.weekend) s += ', week-end';
  if (day.nuit) s += ', nuit';
  return s;
}
/*CALC-END*/

var KEY = 'noamdash-test'; /* données séparées de la version normale */
var MISSIONS = 'https://claude.ai/artifact/Ff3ZbqjcB6FYCZBsdPyeoW';
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var STATUTS = ['Tournage','Montage','V1','Retours','Livré'];
var PAGES = ['Tournage','Frais de prod','Post-prod','Résultat'];
var SET_DEFS = [
  ['demi','Demi-journée','€'], ['jour','Journée','€'], ['taux','Taux montage','€/h'], ['retours','Retours / export','%'],
  ['nuit','Majoration nuit','%'], ['weekend','Week-end / férié','%'], ['urgence','Urgence < 48h','%'], ['uber','Uber aller-retour','€'],
  ['marge','Marge frais','%'], ['photo','Forfait photo','€'], ['urssaf','Taux URSSAF','%']
];
var FRAIS_TYPES = {
  matos:{title:'Location matos', lab:'Libellé', def:'Location matos', chips:[]},
  personne:{title:'Personne à payer', lab:'Nom / rôle', def:'Personne', chips:['Photographe','Cadreur','Ingé son','Assistant']},
  autre:{title:'Train / Hôtel / Autre', lab:'Libellé', def:'Autre', chips:['Train','Hôtel','Repas','Autre']}
};
var IDLE_MS = 120000;
var STOPS = [5, 10, 25, 50, 90], POS = [10, 30, 50, 70, 90];
var IC = {
  back:'<path d="M15 18l-6-6 6-6"/>', prev:'<path d="M15 18l-6-6 6-6"/>', next:'<path d="M9 18l6-6-6-6"/>',
  arrow:'<path d="M7 17L17 7M9 7h8v8"/>', euro:'<path d="M17 6.5A6.5 6.5 0 1 0 17 17.5M4 10.5h9M4 13.5h9"/>',
  check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 9l2 2 4-4M8 15h8"/>'
};
function ico(p, cls){ return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }

var $ = function(id){ return document.getElementById(id); };
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function eur(x){
  var n = Math.round(num(x));
  var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (n < 0 ? '−' : '') + s + ' €';
}
function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function setText(id, v){ var e = $(id); if (e && e.textContent !== v) e.textContent = v; }
function setCls(id, cls, on){ var e = $(id); if (e && e.classList.contains(cls) !== on) e.classList.toggle(cls, on); }

function newDay(){ return {date:isoDate(new Date()), nuit:false, demi:0, jour:0, photo:false}; }
function newDevis(){ return {page:0, days:[newDay()], frais:[], trajets:0, heures:0, urgence:false}; }

var data;
function normalize(d){
  d = (d && typeof d === 'object') ? d : {};
  var s = {}, k;
  for (k in DEFAULTS) s[k] = DEFAULTS[k];
  if (d.settings) for (k in d.settings) if (DEFAULTS.hasOwnProperty(k)) s[k] = d.settings[k];
  d.settings = s;
  if (!d.devis || !d.devis.days || !d.devis.days.length) d.devis = newDevis();
  if (!d.devis.frais) d.devis.frais = [];
  d.devis.page = Math.max(0, Math.min(3, num(d.devis.page)));
  if (!(d.projects instanceof Array)) d.projects = [];
  if (!d.sessions || typeof d.sessions !== 'object') d.sessions = {};
  if (d.chrono === undefined) d.chrono = null;
  if (STOPS.indexOf(num(d.chronoSel)) < 0) d.chronoSel = 25;
  return d;
}
function load(){
  var raw = null;
  try { raw = window.localStorage.getItem(KEY) || window.localStorage.getItem('noamdash'); } catch(e){}
  try { data = normalize(raw ? JSON.parse(raw) : null); } catch(e){ data = normalize(null); }
}
function save(){ try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }

/* ---------- Verre dépoli : cale le fond flouté sur chaque carte (une fois par affichage) ---------- */
function alignGlass(scope){
  var els = (scope || document).querySelectorAll('.glass');
  for (var i = 0; i < els.length; i++){
    var r = els[i].getBoundingClientRect();
    if (!r.width) continue;
    els[i].style.backgroundPosition = '0 0, ' + (-Math.round(r.left + 1)) + 'px ' + (-Math.round(r.top + 1)) + 'px';
  }
}
var scrollT = null;
document.addEventListener('scroll', function(e){
  var t = e.target;
  clearTimeout(scrollT);
  scrollT = setTimeout(function(){ if (t && t.querySelectorAll) alignGlass(t); }, 120);
}, true);
window.addEventListener('resize', function(){ alignGlass($('s-' + current)); });

/* ---------- Navigation ---------- */
var current = 'home';
var viewMonth = monthKey(new Date());
function hdr(title, sub, right){
  return '<div class="hdr row"><button class="rbtn" data-act="go" data-arg="home" aria-label="Accueil">' + ico(IC.back) + '</button>' +
    '<div class="grow"><div class="h1">' + title + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right || '') + '</div>';
}
function go(name){
  if (name === 'projets' && current !== 'projets') viewMonth = monthKey(new Date());
  current = name;
  var ids = ['home','chrono','devis','projets','reglages'];
  for (var i = 0; i < ids.length; i++) $('s-' + ids[i]).className = 'screen' + (ids[i] === name ? ' active' : '');
  if (name === 'home') renderHome();
  if (name === 'chrono') renderChrono();
  if (name === 'devis') renderDevis();
  if (name === 'projets') renderProjets();
  if (name === 'reglages') renderReglages();
  tick();
}

/* ---------- Audio ---------- */
var AC = window.AudioContext || window.webkitAudioContext;
var actx = null;
function unlockAudio(){
  if (!AC) return;
  try {
    if (!actx) actx = new AC();
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    var b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
    src.buffer = b; src.connect(actx.destination); src.start(0);
  } catch(e){}
}
function beep(){
  if (!actx) return;
  try {
    if (actx.state === 'suspended' && actx.resume) actx.resume();
    var t0 = actx.currentTime + 0.05;
    for (var i = 0; i < 8; i++){
      var t = t0 + i * 0.45, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = (i % 2) ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.32);
    }
  } catch(e){}
}

/* ---------- Chrono ---------- */
function remaining(c){
  if (!c || c.done) return 0;
  if (c.running) return Math.max(0, c.endAt - Date.now());
  return c.rem;
}
function fmtTime(ms){ var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return pad(m) + ':' + pad(s % 60); }
function todayCount(){ return data.sessions[isoDate(new Date())] || 0; }
function checkChronoEnd(silent){
  var c = data.chrono;
  if (c && c.running && !c.done && Date.now() >= c.endAt){
    c.done = true; c.running = false; c.rem = 0;
    if (c.kind === 'work'){ var k = isoDate(new Date(c.endAt)); data.sessions[k] = (data.sessions[k] || 0) + 1; }
    save();
    if (!silent) beep();
  }
}
function chronoState(){
  var c = data.chrono;
  if (c) return {c:c, left:remaining(c), dur:c.dur, kind:c.kind, min:c.min};
  var m = num(data.chronoSel) || 25;
  return {c:null, left:m * 60000, dur:m * 60000, kind:m <= 10 ? 'pause' : 'work', min:m};
}
function chronoSub(s){
  var c = s.c;
  if (c && c.done) return c.kind === 'work' ? 'Travail terminé !' : 'Pause terminée !';
  if (c && c.running){ var e = new Date(c.endAt); return 'Fin à ' + pad(e.getHours()) + ':' + pad(e.getMinutes()); }
  if (c) return 'En pause';
  return (s.kind === 'work' ? 'Travail' : 'Pause') + ' · ' + s.min + ' min';
}
function glowColor(s){
  var f = s.dur ? s.left / s.dur : 1;
  return f > 0.5 ? '#4ade80' : (f > 0.2 ? '#A78BFA' : '#ffffff');
}
var RING_C = 2 * Math.PI * 45;
var PRESETS = [[25,'Travail 25'], [50,'Travail 50'], [90,'Travail 90'], [5,'Pause 5'], [10,'Pause 10']];
function ringSvg(id){
  return '<svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"/>' +
    '<circle class="bar" id="' + id + '" cx="50" cy="50" r="45" stroke="#4ade80" stroke-dasharray="' + RING_C.toFixed(2) + '" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg>';
}
function placeRing(id, s){
  var e = $(id);
  if (!e) return;
  var f = s.dur ? s.left / s.dur : 1, off = (RING_C * (1 - f)).toFixed(1), col = glowColor(s);
  if (e.getAttribute('stroke-dashoffset') !== off) e.setAttribute('stroke-dashoffset', off);
  if (e.getAttribute('stroke') !== col) e.setAttribute('stroke', col);
}
var preSel = null;
function updateChrono(){
  var s = chronoState(), time = fmtTime(s.left), sub = chronoSub(s);
  var on = !!(s.c && s.c.running), fl = !!(s.c && s.c.done && flashOn);
  if (current === 'home'){
    setText('hc-time', time); setCls('hc-card', 'flash', fl); placeRing('hc-bar', s);
  } else if (current === 'chrono'){
    setText('cc-time', time); setText('cc-sub', sub);
    setText('cc-mode', s.kind === 'work' ? 'Travail' : 'Pause');
    setCls('cc-tgl', 'on', on); setCls('cc-card', 'flash', fl);
    setCls('cc-stop', 'hidden', !s.c);
    setText('sess', String(todayCount()));
    placeRing('cc-bar', s);
    if (s.min !== preSel){
      preSel = s.min;
      var b = document.querySelectorAll('#s-chrono .pre');
      for (var i = 0; i < b.length; i++) b[i].className = 'pre' + (+b[i].getAttribute('data-arg') === s.min ? ' on' : '');
    }
  }
}

/* ---------- Tick : seuls les textes, la poignée et les états changent ---------- */
var lastActivity = Date.now(), flashOn = false;
var lastHM = '', lastDate = '', lastGreet = '';
function tick(){
  flashOn = !flashOn;
  var now = new Date(), hr = now.getHours();
  var hm = pad(hr) + ':' + pad(now.getMinutes());
  if (hm !== lastHM){ $('clock').textContent = hm; lastHM = hm; }
  var ds = cap(JOURS[now.getDay()]) + ' ' + (now.getDate() === 1 ? '1er' : now.getDate()) + ' ' + MOIS[now.getMonth()];
  if (ds !== lastDate){ $('date').textContent = ds; lastDate = ds; }
  var gr = (hr >= 5 && hr < 18) ? 'Bonjour Noam' : 'Bonsoir Noam';
  if (gr !== lastGreet){ $('greet').textContent = gr; lastGreet = gr; }
  checkChronoEnd(false);
  updateChrono();
  if (Date.now() - lastActivity > IDLE_MS){
    lastActivity = Date.now();
    if (current !== 'home' || modalOpen() || confirmOpen()){
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      closeModal(); closeConfirm();
      go('home');
    }
  }
}
function markActivity(){ lastActivity = Date.now(); }

/* ---------- Accueil ---------- */
function monthProjects(mk){
  var r = {list:[], brut:0, paid:0};
  for (var i = 0; i < data.projects.length; i++){
    var p = data.projects[i];
    if (p.month !== mk) continue;
    r.list.push(p); r.brut += num(p.amount); if (p.paid) r.paid += num(p.amount);
  }
  return r;
}
function renderHome(){
  var h = '<div class="glass widget" id="hc-card" data-act="go" data-arg="chrono"><div class="wtop"><div class="wring">' + ringSvg('hc-bar') +
    '<div class="wring-c"><div class="hc-time num" id="hc-time"></div></div></div></div><div class="wname">Chrono</div></div>';
  h += '<div class="glass widget" data-act="go" data-arg="devis"><div class="wtop"><div class="wtile">' + ico(IC.euro) + '</div></div><div class="wname">Devis</div></div>';
  h += '<div class="glass widget" data-act="link" data-arg="' + MISSIONS + '"><div class="wtop"><div class="wtile">' + ico(IC.check) + '</div></div><div class="wname">Projets</div></div>';
  $('widgets').innerHTML = h;
  alignGlass($('s-home'));
  updateChrono();
}

/* ---------- Chrono (écran) ---------- */
function renderChrono(){
  var h = hdr('Chrono', '', '<div class="sess">Sessions aujourd’hui<b class="num" id="sess">0</b></div>');
  h += '<div class="glass c-big" id="cc-card"><div class="row ctop"><div class="mode" id="cc-mode"></div><div class="grow"></div>' +
    '<button id="cc-stop" data-act="cstop">Stop</button>' +
    '<div class="tgl-hit big" data-act="ctoggle"><span class="tgl big" id="cc-tgl"><span class="knob"></span></span></div></div>' +
    '<div class="cring" id="cc-ring">' + ringSvg('cc-bar') + '<div class="cring-c"><div class="cc-time num" id="cc-time"></div><div class="cc-sub" id="cc-sub"></div></div></div>' +
    '<div class="presets row">';
  for (var i = 0; i < PRESETS.length; i++) h += '<button class="pre" data-act="csel" data-arg="' + PRESETS[i][0] + '">' + PRESETS[i][1] + '</button>';
  h += '</div></div>';
  $('s-chrono').innerHTML = h;
  preSel = null;
  /* taille du temps adaptée à la hauteur réelle de l'anneau (calculée une fois) */
  var rh = $('cc-ring').offsetHeight;
  if (rh) $('cc-time').style.fontSize = Math.max(60, Math.min(120, Math.floor(rh * 0.27))) + 'px';
  alignGlass($('s-chrono'));
  updateChrono();
}

/* ---------- Devis ---------- */
function stepper(label, value, act, arg){
  return '<div class="stp">' + (label ? '<div class="stp-l">' + label + '</div>' : '') +
    '<div class="row"><button class="sb" data-act="' + act + '" data-arg="' + arg + ':-1">–</button>' +
    '<div class="sv num">' + value + '</div>' +
    '<button class="sb" data-act="' + act + '" data-arg="' + arg + ':1">+</button></div></div>';
}
function sw(label, on, act, arg){
  return '<button class="swrow" data-act="' + act + '"' + (arg !== undefined ? ' data-arg="' + arg + '"' : '') + '>' + label +
    '<span class="tgl' + (on ? ' on' : '') + '"><span class="knob"></span></span></button>';
}
function badgeText(info, st){
  if (info.ferie) return 'Férié +' + num(st.weekend) + ' % · ' + info.ferie;
  if (info.weekend) return 'Week-end +' + num(st.weekend) + ' %';
  return '';
}
function renderDevis(){
  var dv = data.devis, st = data.settings, r = calcDevis(dv, st), p = dv.page;
  var old = document.querySelector('#s-devis .content'), scroll = old ? old.scrollTop : 0;
  var dots = '';
  for (var i = 0; i < 4; i++) dots += '<span' + (i === p ? ' class="on"' : '') + '></span>';
  var h = hdr('Devis', (p+1) + ' / 4 · ' + PAGES[p],
    '<div class="dots">' + dots + '</div><div class="bpill num"><small>BRUT</small><span id="dv-brut">' + eur(r.brut) + '</span></div>');
  h += '<div class="content">' + devisPage(p, dv, st, r) + '</div>';
  h += '<div class="foot row"><button data-act="dvprev">← Retour</button>' +
    (p < 3 ? '<button class="white" data-act="dvnext">Suivant →</button>' : '<button class="white" data-act="dvnew">Nouveau devis</button>') + '</div>';
  $('s-devis').innerHTML = h;
  var nc = document.querySelector('#s-devis .content');
  if (nc && old) nc.scrollTop = scroll;
  alignGlass($('s-devis'));
}
function devisPage(p, dv, st, r){
  var h = '', i;
  if (p === 0){
    for (i = 0; i < dv.days.length; i++){
      var d = dv.days[i], c = dayCalc(d, st), bt = badgeText(c.info, st);
      h += '<div class="glass day"><div class="row">' +
        '<div class="dlabel">Jour ' + (i+1) + '</div>' +
        '<input class="dinput" type="date" data-day="' + i + '" value="' + esc(d.date) + '">' +
        '<div class="badge' + (bt ? '' : ' hidden') + '" id="badge-' + i + '">' + esc(bt) + '</div>' +
        '<div class="grow"></div><div class="dprice num" id="dprice-' + i + '">' + eur(c.total) + '</div>' +
        (dv.days.length > 1 ? '<button class="xbtn" data-act="ddel" data-arg="' + i + '">✕</button>' : '') +
        '</div><div class="row" style="margin-top:14px">' +
        stepper('Demi-journées · ' + eur(st.demi), num(d.demi), 'dstep', 'demi:' + i) +
        stepper('Journées · ' + eur(st.jour), num(d.jour), 'dstep', 'jour:' + i) +
        '<div class="grow"></div><div>' +
        sw('De nuit +' + num(st.nuit) + ' %', d.nuit, 'dtog', 'nuit:' + i) +
        sw(num(st.photo) ? 'Photo +' + eur(st.photo) : 'Photo en plus', d.photo, 'dtog', 'photo:' + i) +
        '</div></div></div>';
    }
    h += '<button class="addday" data-act="dadd">+ Ajouter un jour</button>';
  } else if (p === 1){
    h += '<div class="row" style="margin-bottom:14px">' +
      '<button class="glass fbtn" data-act="fopen" data-arg="matos">Location<br>matos</button>' +
      '<button class="glass fbtn" data-act="fopen" data-arg="personne">Personne<br>à payer</button>' +
      '<button class="glass fbtn" data-act="fopen" data-arg="autre">Train / Hôtel<br>/ Autre</button></div>';
    var tr = num(dv.trajets) * num(st.uber);
    h += '<div class="glass fline row"><div class="grow"><div class="fl">Trajets (Uber)</div>' +
      '<div class="fd">' + eur(st.uber) + ' réels par aller-retour · marge ' + num(st.marge) + ' %</div></div>' +
      stepper('', num(dv.trajets), 'tstep', 't') +
      '<div class="fv num" style="min-width:140px;text-align:right">' + eur(fraisBilled(tr, st.marge)) + '</div></div>';
    if (!dv.frais.length) h += '<div class="empty">Aucun autre frais ajouté</div>';
    for (i = 0; i < dv.frais.length; i++){
      var f = dv.frais[i];
      h += '<div class="glass fline row"><div class="grow"><div class="fl">' + esc(f.label) + '</div>' +
        '<div class="fd">réel ' + eur(f.reel) + ' · marge ' + num(f.marge) + ' %</div></div>' +
        '<div class="fv num">' + eur(fraisBilled(f.reel, f.marge)) + '</div>' +
        '<button class="xbtn" data-act="fdel" data-arg="' + i + '">✕</button></div>';
    }
  } else if (p === 2){
    var mo = montageCalc(dv, st), coef = String(1 + num(st.retours) / 100).replace('.', ',');
    h += '<div class="glass pp"><div class="pp-l">Heures de montage</div>' +
      stepper('', num(dv.heures) + ' h', 'hstep', 'h') +
      '<div class="pp-f num">' + mo.heures + ' h × ' + coef + ' × ' + eur(st.taux) + ' = ' + eur(mo.base) + '</div>' +
      sw('Urgence < 48h +' + num(st.urgence) + ' %', dv.urgence, 'urg') +
      '<div class="pp-t num">Montage ' + eur(mo.total) + '</div></div>';
  } else {
    h += '<div class="res"><div class="glass light res-l">' +
      '<div class="big-l">À facturer (brut)</div><div class="bv num">' + eur(r.brut) + '</div>' +
      '<div class="mid num">URSSAF ' + num(st.urssaf) + ' % : − ' + eur(r.urssaf) + '</div>' +
      '<div class="mid num">Frais réels : − ' + eur(r.reels) + '</div>' +
      '<div class="big-l" style="margin-top:22px"><span class="dot g"></span>Tu touches (net)</div><div class="bv num">' + eur(r.net) + '</div>' +
      '</div><div class="glass res-r">';
    var groups = [['Tournage', r.tournage], ['Frais', r.frais], ['Montage', r.montage]];
    for (var g = 0; g < groups.length; g++){
      h += '<div class="dh row"><div class="grow">' + groups[g][0] + '</div><div class="num">' + eur(groups[g][1]) + '</div></div>';
      var any = false;
      for (i = 0; i < r.lines.length; i++) if (r.lines[i].g === groups[g][0]){
        any = true;
        h += '<div class="dl row"><div class="grow">' + esc(r.lines[i].label) + '</div><b class="num">' + eur(r.lines[i].amount) + '</b></div>';
      }
      if (!any) h += '<div class="dl muted">—</div>';
    }
    h += '</div></div>';
  }
  return h;
}
function updateDevisLive(){
  var dv = data.devis, st = data.settings;
  setText('dv-brut', eur(calcDevis(dv, st).brut));
  for (var i = 0; i < dv.days.length; i++){
    var c = dayCalc(dv.days[i], st), b = $('badge-' + i), t = badgeText(c.info, st);
    if (b){ b.textContent = t; b.className = 'badge' + (t ? '' : ' hidden'); }
    setText('dprice-' + i, eur(c.total));
  }
}

/* ---------- Fenêtres ---------- */
var modal = null, confirmCb = null;
function modalOpen(){ return !!modal; }
function confirmOpen(){ return !!confirmCb; }
function openModal(state, html){ modal = state; var m = $('modal'); m.innerHTML = '<div class="mbox">' + html + '</div>'; m.className = 'overlay show'; m.scrollTop = 0; }
function closeModal(){ modal = null; $('modal').className = 'overlay'; $('modal').innerHTML = ''; }
function askConfirm(msg, okLabel, cb){ confirmCb = cb; $('cf-msg').textContent = msg; $('cf-ok').textContent = okLabel; $('confirm').className = 'overlay show'; }
function closeConfirm(){ confirmCb = null; $('confirm').className = 'overlay'; }
function margeRow(v){
  return '<div class="mrow row"><label>Marge</label>' +
    '<button class="sb" data-act="mmarge" data-arg="-1">–</button>' +
    '<input type="number" inputmode="decimal" id="m-marge" data-bind="marge" value="' + esc(v) + '" style="width:150px">' +
    '<button class="sb" data-act="mmarge" data-arg="1">+</button><span style="font-size:28px">%</span></div>';
}
function openFrais(type){
  var T = FRAIS_TYPES[type];
  var st = {kind:'frais', type:type, label:type === 'matos' ? T.def : '', reel:'', marge:num(data.settings.marge)};
  var chips = '';
  for (var i = 0; i < T.chips.length; i++) chips += '<button class="chip" data-act="mchip" data-arg="' + esc(T.chips[i]) + '">' + esc(T.chips[i]) + '</button>';
  openModal(st,
    '<div class="mtitle">' + T.title + '</div>' +
    '<div class="mrow row"><label>' + T.lab + '</label><input type="text" id="m-label" data-bind="label" value="' + esc(st.label) + '"></div>' +
    (chips ? '<div class="mrow row"><label></label>' + chips + '</div>' : '') +
    '<div class="mrow row"><label>Prix réel</label><input type="number" inputmode="decimal" id="m-reel" data-bind="reel" value="" placeholder="0"><span style="font-size:28px">€</span></div>' +
    margeRow(st.marge) +
    '<div class="mprev num" id="m-prev"></div>' +
    '<div class="row mbtns"><button data-act="mclose">Annuler</button><button class="white" data-act="fsave">Ajouter</button></div>');
  updatePreview();
}
function updatePreview(){
  if (!modal || modal.kind !== 'frais') return;
  $('m-prev').textContent = 'Facturé : ' + eur(fraisBilled(modal.reel, modal.marge));
}
function openProject(id){
  var p = null;
  for (var i = 0; i < data.projects.length; i++) if (data.projects[i].id === id) p = data.projects[i];
  var st = {kind:'project', id:p ? p.id : null, client:p ? p.client : '', amount:p ? p.amount : ''};
  openModal(st,
    '<div class="mtitle">' + (p ? 'Modifier le projet' : 'Nouveau projet') + '</div>' +
    '<div class="mrow row"><label>Client</label><input type="text" id="m-client" data-bind="client" value="' + esc(st.client) + '"></div>' +
    '<div class="mrow row"><label>Montant brut</label><input type="number" inputmode="decimal" data-bind="amount" value="' + esc(st.amount) + '" placeholder="0"><span style="font-size:28px">€</span></div>' +
    '<div class="row mbtns" style="margin-top:30px"><button data-act="mclose">Annuler</button>' +
    (p ? '<button class="vio" data-act="pdel">Supprimer</button>' : '') +
    '<button class="white" data-act="psave">Enregistrer</button></div>');
}

/* ---------- Projets ---------- */
function monthLabel(k){ var a = k.split('-'); return cap(MOIS[+a[1]-1]) + ' ' + a[0]; }
function shiftMonth(k, d){ var a = k.split('-'); return monthKey(new Date(+a[0], +a[1]-1+d, 1)); }
function tot(l, v){ return '<div class="glass tot"><div class="tot-l">' + l + '</div><div class="tot-v num">' + eur(v) + '</div></div>'; }
function renderProjets(){
  var old = document.querySelector('#s-projets .content'), scroll = old ? old.scrollTop : 0;
  var mp = monthProjects(viewMonth), i;
  var h = '<div class="hdr row"><button class="rbtn" data-act="go" data-arg="home" aria-label="Accueil">' + ico(IC.back) + '</button>' +
    '<button class="rbtn" data-act="pmonth" data-arg="-1" aria-label="Mois précédent">' + ico(IC.prev) + '</button>' +
    '<div class="grow h1 center">' + monthLabel(viewMonth) + '</div>' +
    '<button class="rbtn" data-act="pmonth" data-arg="1" aria-label="Mois suivant">' + ico(IC.next) + '</button>' +
    '<button class="rbtn" data-act="link" data-arg="' + MISSIONS + '" aria-label="Missions du jour">' + ico(IC.check) + '</button>' +
    '<button class="white" data-act="padd">+ Projet</button></div><div class="content">';
  if (!mp.list.length) h += '<div class="empty">Aucun projet ce mois-ci.<br>Appui long sur une carte pour la modifier.</div>';
  h += '<div class="pgrid">';
  for (i = 0; i < mp.list.length; i++){
    var p = mp.list[i];
    h += '<div class="glass pcard" data-lp="' + esc(p.id) + '"><div class="pc-c">' + esc(p.client || 'Sans nom') + '</div>' +
      '<div class="pc-m num">' + eur(p.amount) + '</div>' +
      '<button class="' + (p.status === 4 ? 'ok' : '') + '" data-act="pstat" data-arg="' + esc(p.id) + '">' + STATUTS[p.status] + ' →</button>' +
      '<button class="' + (p.paid ? 'ok' : 'ko') + '" data-act="ppaid" data-arg="' + esc(p.id) + '">' + (p.paid ? '✓ Payé' : 'Pas payé') + '</button></div>';
  }
  var u = mp.brut * num(data.settings.urssaf) / 100;
  h += '</div></div><div class="tots row">' +
    tot('Brut', mp.brut) + tot('URSSAF ' + num(data.settings.urssaf) + ' %', u) + tot('Net', mp.brut - u) +
    tot('Encaissé', mp.paid) + tot('À encaisser', mp.brut - mp.paid) + '</div>';
  $('s-projets').innerHTML = h;
  var nc = document.querySelector('#s-projets .content');
  if (nc && old) nc.scrollTop = scroll;
  alignGlass($('s-projets'));
}
function findProject(id){ for (var i = 0; i < data.projects.length; i++) if (data.projects[i].id === id) return i; return -1; }

/* ---------- Réglages ---------- */
function renderReglages(){
  var h = hdr('Réglages') + '<div class="content"><div class="sgrid">';
  for (var i = 0; i < SET_DEFS.length; i++){
    var d = SET_DEFS[i];
    h += '<div class="glass sitem"><div class="sitem-l">' + d[1] + '</div><div class="row">' +
      '<input type="number" inputmode="decimal" data-set="' + d[0] + '" value="' + esc(data.settings[d[0]]) + '"' + (d[0] === 'photo' ? ' placeholder="—"' : '') + '>' +
      '<span class="u">' + d[2] + '</span></div></div>';
  }
  h += '</div><div class="row" style="margin-top:4px"><button class="grow" data-act="exp">Exporter les données</button><button class="grow" data-act="imp">Importer des données</button></div>' +
    '<div class="muted" style="font-size:20px;margin-top:14px">Les données restent sur cet iPad. Exporte de temps en temps et colle le texte dans Notes.</div></div>';
  $('s-reglages').innerHTML = h;
  alignGlass($('s-reglages'));
}

/* ---------- Actions ---------- */
function handle(act, arg){
  var dv = data.devis, a, i, p, c;
  switch (act){
    case 'go': closeModal(); go(arg); return;
    case 'link': closeModal(); window.open(arg, '_blank'); return;
    case 'csel':
      if (data.chrono && data.chrono.running) return;
      data.chrono = null; data.chronoSel = +arg; save(); break;
    case 'ctoggle':
      c = data.chrono;
      if (!c || c.done){
        unlockAudio();
        var m = num(data.chronoSel) || 25, ms = m * 60000;
        data.chrono = {kind:m <= 10 ? 'pause' : 'work', min:m, dur:ms, endAt:Date.now() + ms, rem:ms, running:true, done:false};
      } else if (c.running){ c.rem = Math.max(0, c.endAt - Date.now()); c.running = false; }
      else { unlockAudio(); c.endAt = Date.now() + c.rem; c.running = true; }
      save(); break;
    case 'cstop': data.chrono = null; save(); break;

    case 'dvnext': dv.page = Math.min(3, dv.page + 1); save(); renderDevis(); return;
    case 'dvprev': if (dv.page === 0){ go('home'); return; } dv.page--; save(); renderDevis(); return;
    case 'dvnew':
      askConfirm('Effacer ce devis et en commencer un nouveau ?', 'Effacer', function(){ data.devis = newDevis(); save(); renderDevis(); });
      return;
    case 'dadd': dv.days.push(newDay()); save(); renderDevis();
      var ct = document.querySelector('#s-devis .content'); if (ct){ ct.scrollTop = ct.scrollHeight; alignGlass(ct); } return;
    case 'ddel': dv.days.splice(+arg, 1); save(); renderDevis(); return;
    case 'dstep':
      a = arg.split(':'); var day = dv.days[+a[1]];
      day[a[0]] = Math.max(0, num(day[a[0]]) + (+a[2])); save(); renderDevis(); return;
    case 'dtog': a = arg.split(':'); dv.days[+a[1]][a[0]] = !dv.days[+a[1]][a[0]]; save(); renderDevis(); return;
    case 'tstep': dv.trajets = Math.max(0, num(dv.trajets) + (+arg.split(':')[1])); save(); renderDevis(); return;
    case 'hstep': dv.heures = Math.max(0, num(dv.heures) + (+arg.split(':')[1])); save(); renderDevis(); return;
    case 'urg': dv.urgence = !dv.urgence; save(); renderDevis(); return;
    case 'fopen': openFrais(arg); return;
    case 'fdel': dv.frais.splice(+arg, 1); save(); renderDevis(); return;
    case 'mchip': if (modal){ modal.label = arg; $('m-label').value = arg; } return;
    case 'mmarge':
      if (!modal) return;
      modal.marge = Math.max(0, num(modal.marge) + (+arg)); $('m-marge').value = modal.marge; updatePreview(); return;
    case 'mclose': closeModal(); return;
    case 'fsave':
      if (!modal) return;
      if (num(modal.reel) <= 0){ $('m-reel').style.borderColor = '#A78BFA'; return; }
      dv.frais.push({type:modal.type, label:(modal.label || '').replace(/^\s+|\s+$/g, '') || FRAIS_TYPES[modal.type].def, reel:num(modal.reel), marge:num(modal.marge)});
      save(); closeModal(); renderDevis(); return;

    case 'pmonth': viewMonth = shiftMonth(viewMonth, +arg); renderProjets(); return;
    case 'padd': openProject(null); return;
    case 'pstat': i = findProject(arg); if (i < 0) return; p = data.projects[i]; p.status = (p.status + 1) % STATUTS.length; save(); renderProjets(); return;
    case 'ppaid': i = findProject(arg); if (i < 0) return; data.projects[i].paid = !data.projects[i].paid; save(); renderProjets(); return;
    case 'psave':
      if (!modal) return;
      var cl = (modal.client || '').replace(/^\s+|\s+$/g, '');
      if (!cl){ $('m-client').style.borderColor = '#A78BFA'; return; }
      if (modal.id){ i = findProject(modal.id); if (i >= 0){ data.projects[i].client = cl; data.projects[i].amount = num(modal.amount); } }
      else data.projects.push({id:Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36), month:viewMonth, client:cl, amount:num(modal.amount), status:0, paid:false});
      save(); closeModal(); renderProjets(); return;
    case 'pdel':
      if (!modal) return;
      var pid = modal.id;
      askConfirm('Supprimer ce projet ?', 'Supprimer', function(){ i = findProject(pid); if (i >= 0) data.projects.splice(i, 1); save(); closeModal(); renderProjets(); });
      return;

    case 'exp':
      openModal({kind:'export'}, '<div class="mtitle">Exporter</div><div class="muted" style="font-size:22px;margin-bottom:14px">Copie ce texte et garde-le (Notes, mail…).</div>' +
        '<textarea id="m-txt" rows="14" readonly>' + esc(JSON.stringify(data)) + '</textarea>' +
        '<div class="row mbtns" style="margin-top:20px"><button data-act="selall">Tout sélectionner / copier</button><button class="white" data-act="mclose">Fermer</button></div>');
      return;
    case 'selall':
      var ta = $('m-txt'); ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); } catch(e){}
      ta.setAttribute('readonly', 'readonly'); return;
    case 'imp':
      openModal({kind:'import'}, '<div class="mtitle">Importer</div><div class="muted" style="font-size:22px;margin-bottom:14px">Colle ici un texte exporté. Toutes les données actuelles seront remplacées.</div>' +
        '<textarea id="m-txt" rows="12"></textarea><div id="m-err" style="color:#cbb8ff;font-size:24px;margin-top:10px"></div>' +
        '<div class="row mbtns" style="margin-top:20px"><button data-act="mclose">Annuler</button><button class="white" data-act="impok">Importer</button></div>');
      return;
    case 'impok':
      var parsed = null;
      try { parsed = JSON.parse($('m-txt').value); } catch(e){}
      if (!parsed || typeof parsed !== 'object' || !parsed.settings){ $('m-err').textContent = 'Texte invalide.'; return; }
      askConfirm('Remplacer toutes les données par celles importées ?', 'Remplacer', function(){ data = normalize(parsed); save(); closeModal(); go('reglages'); });
      return;

    case 'cfyes': var cb = confirmCb; closeConfirm(); if (cb) cb(); return;
    case 'cfno': closeConfirm(); return;
  }
  tick();
}

function closestAttr(el, attr){
  while (el && el.nodeType === 1){ if (el.hasAttribute(attr)) return el; el = el.parentNode; }
  return null;
}

/* Appui long (projets) */
var lpTimer = null, lpFired = false, lpX = 0, lpY = 0, lpSwallowUntil = 0;
function lpStart(target, x, y){
  lpFired = false;
  var card = closestAttr(target, 'data-lp');
  clearTimeout(lpTimer);
  if (!card) return;
  lpX = x; lpY = y;
  var id = card.getAttribute('data-lp');
  lpTimer = setTimeout(function(){ lpFired = true; openProject(id); }, 650);
}
function lpMove(x, y){ if (Math.abs(x - lpX) > 12 || Math.abs(y - lpY) > 12) clearTimeout(lpTimer); }
function lpEnd(){ clearTimeout(lpTimer); if (lpFired){ lpFired = false; lpSwallowUntil = Date.now() + 400; } }

document.addEventListener('touchstart', function(e){ markActivity(); var t = e.touches[0]; lpStart(e.target, t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchmove', function(e){ var t = e.touches[0]; lpMove(t.clientX, t.clientY); }, {passive:true});
document.addEventListener('touchend', lpEnd, {passive:true});
document.addEventListener('touchcancel', lpEnd, {passive:true});
document.addEventListener('mousedown', function(e){ markActivity(); lpStart(e.target, e.clientX, e.clientY); });
document.addEventListener('mousemove', function(e){ if (e.buttons) lpMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', lpEnd);
document.addEventListener('contextmenu', function(e){ if (closestAttr(e.target, 'data-lp')) e.preventDefault(); });
document.addEventListener('keydown', markActivity);
document.addEventListener('touchmove', function(e){
  var el = e.target;
  while (el && el.nodeType === 1){
    if (el.tagName === 'TEXTAREA') return;
    var c = el.className;
    if (typeof c === 'string' && /(^| )(content|res-r|overlay)( |$)/.test(c) && el.scrollHeight > el.clientHeight + 1) return;
    el = el.parentNode;
  }
  e.preventDefault();
}, {passive:false});

document.addEventListener('click', function(e){
  markActivity();
  if (lpFired || Date.now() < lpSwallowUntil){ lpFired = false; lpSwallowUntil = 0; e.preventDefault(); e.stopPropagation(); return; }
  var el = closestAttr(e.target, 'data-act');
  if (!el) return;
  handle(el.getAttribute('data-act'), el.getAttribute('data-arg') || '');
}, true);

document.addEventListener('input', function(e){
  markActivity();
  var t = e.target;
  if (t.hasAttribute('data-bind') && modal){ modal[t.getAttribute('data-bind')] = t.value; t.style.borderColor = ''; updatePreview(); }
  else if (t.hasAttribute('data-set')){ data.settings[t.getAttribute('data-set')] = t.value === '' ? '' : num(t.value); save(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.hasAttribute('data-day')){
    var d = data.devis.days[+t.getAttribute('data-day')];
    if (d){ d.date = t.value; save(); updateDevisLive(); }
  } else if (t.hasAttribute('data-set')){
    var k = t.getAttribute('data-set');
    if (t.value === '' && k !== 'photo'){ data.settings[k] = DEFAULTS[k]; t.value = DEFAULTS[k]; }
    else data.settings[k] = t.value === '' ? '' : num(t.value);
    save();
  }
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ markActivity(); tick(); } });

/* ---------- Démarrage ---------- */
load();
checkChronoEnd(true);
go('home');
setInterval(tick, 500);
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  try { navigator.serviceWorker.register('sw.js'); } catch(e){}
}
})();
</script>
